/* Tambah XP+koin, tampilkan toast, dan cek level-up (banner). Dipanggil
   dari renderResult() setelah tiap kuis selesai. */
function awardXPCoins(xp, coins){
  const profile = getPlayerProfile();
  const before = levelInfoFromXP(profile.xp);
  profile.xp += xp;
  profile.coins += coins;
  const after = levelInfoFromXP(profile.xp);
  savePlayerProfile(profile);
  showGameToast(`✨ +${xp} XP  🪙 +${coins} koin`);
  if(after.level > before.level){
    setTimeout(()=> showLevelUpBanner(after.level), 900);
  }
  renderPlayerBar();
  return profile;
}
function showLevelUpBanner(level){
  const el = document.createElement("div");
  el.className = "levelup-banner";
  el.innerHTML = `
    <div class="levelup-card">
      <div class="lu-lv">LV.${level}</div>
      <div class="lu-title">🎉 Naik level! Sekarang kamu "${playerTitle(level)}"</div>
      <button id="luCloseBtn">Lanjut ▶</button>
    </div>`;
  document.body.appendChild(el);
  spawnConfetti(window.innerWidth/2, window.innerHeight/2, 50);
  el.querySelector("#luCloseBtn").addEventListener("click", ()=> el.remove());
}

/* Render bar profil (level, XP, koin) di dashboard, dan pasang tema
   yang sedang dipakai. Dipanggil tiap kali masuk aplikasi / kembali
   ke dashboard. */
/* Streak login harian: cek tiap kali initApp() dipanggil (siswa buka app).
   Kalau tanggal terakhir main = kemarin -> streak lanjut +1.
   Kalau = hari ini juga -> tidak berubah (sudah dihitung hari ini).
   Kalau lebih dari 1 hari lalu -> streak reset ke 1.
   Reward bonus koin di kelipatan 3 hari. */
function checkDailyLoginStreak(){
  const profile = getPlayerProfile();
  const today = todayKey();
  if(profile.lastPlayDate === today) return; // sudah dicek hari ini
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if(profile.lastPlayDate === yesterday){
    profile.streakDays = (profile.streakDays || 0) + 1;
  } else {
    profile.streakDays = 1;
  }
  profile.lastPlayDate = today;
  savePlayerProfile(profile);
  if(profile.streakDays > 1){
    setTimeout(()=> showGameToast(`🔥 Login ${profile.streakDays} hari berturut-turut!`), 500);
  }
  if(profile.streakDays % 3 === 0){
    const bonus = profile.streakDays * 5;
    setTimeout(()=> awardXPCoins(bonus, bonus), 1400);
  }
}

    <div class="shop-card">
      <h3>🏪 Toko</h3>
      <div class="shop-coins">🪙 Koinmu: ${profile.coins}</div>
      <div class="shop-tabs">
        <button class="shop-tab ${initialTab==='theme'?'active':''}" data-tab="theme">🎨 Tema</button>

      </div>

      <div class="shop-pane ${initialTab==='theme'?'active':''}" id="paneTheme">
        ${THEME_SHOP.map(t=>{
          const owned = profile.ownedThemes.includes(t.id);
          const active = profile.theme === t.id;

            </button>
          </div>`;
        }).join("")}
      </div>

      <div class="shop-pane ${initialTab==='avatar'?'active':''}" id="paneAvatar">
        <div class="avatar-name-preview" id="avatarNamePreview">${(AVATAR_SHOP.find(a=>a.id===profile.avatar)||AVATAR_SHOP[0]).name}</div>
        <div class="avatar-grid">
          ${AVATAR_SHOP.map(a=>{
            const owned = profile.ownedAvatars.includes(a.id);
            const active = profile.avatar === a.id;
            return `<div class="avatar-cell ${active?'equipped':''} ${!owned?'locked':''}" data-kind="avatar" data-id="${a.id}" data-price="${a.price}" data-name="${a.name}" title="${a.name}">
              ${a.emoji}
              ${active ? '<span class="ac-check">✓</span>' : (!owned ? '<span class="ac-lock">🔒</span>' : '')}
              <span class="ac-price">${a.price===0?'Gratis':'🪙'+a.price}</span>

          }).join("")}
        </div>
      </div>

  el.querySelectorAll(".shop-tab").forEach(tabBtn=>{

      el.querySelectorAll(".shop-tab").forEach(b=>b.classList.remove("active"));
      el.querySelectorAll(".shop-pane").forEach(p=>p.classList.remove("active"));
      tabBtn.classList.add("active");
      el.querySelector(tabBtn.dataset.tab==='theme' ? "#paneTheme" : "#paneAvatar").classList.add("active");
    });
  });

  // beli/pakai TEMA
  el.querySelectorAll('button[data-kind="theme"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.id, price = parseInt(btn.dataset.price);
      const p = getPlayerProfile();
      if(!p.ownedThemes.includes(id)){
        if(p.coins < price){ showGameToast("🪙 Koin tidak cukup!"); return; }
        p.coins -= price;
        p.ownedThemes.push(id);
      }
      p.theme = id;
      savePlayerProfile(p);
      applyTheme(id);
      el.remove();
      renderPlayerBar();

  el.querySelectorAll('.avatar-cell').forEach(cell=>{

/* ============================================================
   KOTODAMA CARD — kartu koleksi. Tiap jawaban benar mengubah kata
   /pola/soal itu jadi kartu koleksi permanen (disimpan per NIS).
   Rarity mengikuti level (N5 Umum -> N2 Epik), soal Boss selalu
   Legendaris. Kartu baru -> layar reveal dramatis; kartu duplikat
   -> toast ringan + bonus koin kecil (dupe protection).
   ============================================================ */
function cardCollectionKey(){ return `nafis_cards_${(student && student.nis) || "guest"}`; }
function getCardCollection(){
  try{ return JSON.parse(localStorage.getItem(cardCollectionKey())) || {}; }catch(e){ return {}; }
}
function saveCardCollection(c){ localStorage.setItem(cardCollectionKey(), JSON.stringify(c)); }

function cardRarityInfo(level, isBoss){
  if(isBoss) return { cls: "rarity-legend", name: "LEGENDARIS", icon: "🌟" };
  switch(level){
    case "N4": return { cls: "rarity-N4", name: "JARANG", icon: "🍀" };
    case "N3": return { cls: "rarity-N3", name: "LANGKA", icon: "💎" };
    case "N2": return { cls: "rarity-N2", name: "EPIK", icon: "👑" };
    default:   return { cls: "rarity-N5", name: "UMUM", icon: "⚪" };
  }
}

function awardCard(correct, isBoss){
  if(!correct || !correct.jp) return;
  const coll = getCardCollection();
  const key = correct.jp;
  const rarity = cardRarityInfo(correct.level, isBoss);
  const meaning = dispMeaning(correct);
  if(coll[key]){
    coll[key].count++;
    saveCardCollection(coll);
    showCardDupeToast(correct.jp, rarity);
    const p = getPlayerProfile();
    p.coins += 1; // dupe protection: kartu ganda tetap dpt sedikit koin
    savePlayerProfile(p);
  } else {
    coll[key] = { jp: correct.jp, meaning, level: correct.level || "N5", rarityCls: rarity.cls, rarityName: rarity.name, count: 1, dateFirst: new Date().toISOString() };
    saveCardCollection(coll);
    showCardReveal(coll[key], rarity, true);
  }
}

function showCardReveal(card, rarity, isNew){
  const el = document.createElement("div");
  el.className = "card-reveal-overlay";
  el.innerHTML = `
    <div>
      <div class="kotodama-card ${rarity.cls}">
        ${isNew ? '<div class="kc-new">✨ KARTU BARU</div>' : ''}
        <div class="kc-level">${card.level}</div>
        <div class="kc-rarity">${rarity.icon} ${rarity.name}</div>
        <div class="kc-jp">${card.jp}</div>
        <div class="kc-badge">${rarity.icon}</div>
        <div class="kc-meaning">${card.meaning}</div>
      </div>
      <div class="card-reveal-caption">Kartu "${card.jp}" ditambahkan ke Album!</div>
      <button class="card-reveal-close" id="cardRevealCloseBtn">Lanjut ▶</button>
    </div>
  `;
  document.body.appendChild(el);
  playSFX('correct');
  spawnConfetti(window.innerWidth/2, window.innerHeight/2, rarity.cls==='rarity-legend' ? 60 : 30);
  el.querySelector("#cardRevealCloseBtn").addEventListener("click", ()=> el.remove());
}

function showCardDupeToast(jp, rarity){
  const el = document.createElement("div");
  el.className = "card-dupe-toast";
  el.style.setProperty("--r1", getComputedStyle(document.documentElement).getPropertyValue('--cyan'));
  el.innerHTML = `${rarity.icon} <span>Dapat lagi "${jp}" (+1 koin)</span>`;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 2100);

/* Album koleksi: tampilkan semua kartu terkumpul, dikelompokkan per
   level, dgn progress keseluruhan dibanding total kosakata/pola yang
   tersedia di database (biar ada tujuan jangka panjang "koleksi semua"). */
function totalCollectibleCount(){
  try{
    const uniq = new Set();
    (PATTERNS||[]).forEach(p=>uniq.add(p.jp));
    (VOCAB||[]).forEach(v=>uniq.add(v.jp));
    (typeof DOKKAI !== 'undefined' ? DOKKAI : []).forEach(d=>uniq.add(d.title));
    return uniq.size;
  }catch(e){ return 0; }
}
function openAlbum(initialLevel){
  const coll = getCardCollection();
  const cards = Object.values(coll);
  const total = totalCollectibleCount();
  const el = document.createElement("div");
  el.className = "album-overlay";
  const levels = ["all","N5","N4","N3","N2"];
  const renderGrid = (lvl)=>{
    const filtered = lvl==="all" ? cards : cards.filter(c=>c.level===lvl);
    filtered.sort((a,b)=> new Date(b.dateFirst) - new Date(a.dateFirst));
    if(!filtered.length) return `<div style="grid-column:1/-1;text-align:center;color:var(--sub);font-size:12px;padding:20px 0;">Belum ada kartu di sini. Yuk jawab soal!</div>`;
    return filtered.map(c=>{
      const canFuse = c.count >= 3 && !c.evolved;
      return `
      <div class="mini-card ${c.rarityCls} ${c.evolved?'evolved':''}">
        ${c.evolved ? '<span class="mc-sparkle">✨</span>' : ''}
        <div class="mc-jp">${c.jp}</div>
        ${c.count>1 ? `<div class="mc-count">x${c.count}</div>` : ""}
        ${canFuse ? `<button class="mc-fuse-btn" data-fuse="${c.jp}">✨ Fusi</button>` : ""}
      </div>
    `;}).join("");
  };
  el.innerHTML = `
    <div class="album-card">
      <h3>🃏 Album Kotodama</h3>
      <div class="album-progress">${cards.length} / ${total} kata terkumpul (${Math.min(100,Math.round(cards.length/Math.max(1,total)*100))}%)</div>
      <div class="album-track"><div class="album-track-fill" style="width:${Math.min(100,Math.round(cards.length/Math.max(1,total)*100))}%"></div></div>
      <div style="font-size:10px;color:var(--sub);margin-bottom:8px;">💡 Kumpulkan 3 kartu yang sama untuk fusi jadi versi ✨Kirakira</div>
      <div class="album-tabs">
        ${levels.map(l=>`<button class="album-tab ${l===(initialLevel||'all')?'active':''}" data-lvl="${l}">${l==='all'?'Semua':l}</button>`).join("")}
      </div>
      <div class="album-grid" id="albumGrid">${renderGrid(initialLevel||"all")}</div>
      <button class="shop-close" id="albumCloseBtn">Tutup</button>
    </div>
  `;
  document.body.appendChild(el);
  const currentTab = ()=> el.querySelector(".album-tab.active")?.dataset.lvl || "all";
  const rebindFuseButtons = ()=>{
    el.querySelectorAll("[data-fuse]").forEach(btn=>{
      btn.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        fuseCard(btn.dataset.fuse);
        el.querySelector("#albumGrid").innerHTML = renderGrid(currentTab());
        rebindFuseButtons();
      });
    });
  };
  rebindFuseButtons();
  el.querySelectorAll(".album-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      el.querySelectorAll(".album-tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      el.querySelector("#albumGrid").innerHTML = renderGrid(tab.dataset.lvl);
      rebindFuseButtons();
    });
  });
  el.querySelector("#albumCloseBtn").addEventListener("click", ()=> el.remove());
}

/* ============================================================
   SENSEI BUBBLE — komentar singkat dari maskot selama kuis,
   bikin sesi kuis kerasa lebih hidup & ada "kepribadian".
   ============================================================ */
const SENSEI_LINES = {
  correct: ["やった！(Yatta!)", "Sugoi! 👍", "Pintar sekali!", "完璧！Kanpeki!", "Betul banget!", "Nice one!"],
  wrong:   ["ドンマイ！Don't mind!", "Coba lagi ya~", "Sedikit lagi!", "がんばれ！Ganbatte!", "Tetap semangat!"],
  streak5: ["🔥 On fire nih!", "Combo mantap!", "Terus lanjutkan!"],
  streak10:["⚡ LUAR BIASA!", "Kamu jagoan!", "Tak terhentikan!"],
  bossWin: ["🎉 Boss kalah!", "Kamu menang!", "Hebat sekali!!"],
  bossLose:["💥 Hampir saja...", "Coba lagi lain kali!"]
};
function showSenseiBubble(kind){
  const anchor = $("quizAvatar");
  if(!anchor) return;
  const lines = SENSEI_LINES[kind] || SENSEI_LINES.correct;
  const text = lines[Math.floor(Math.random()*lines.length)];
  const bubble = document.createElement("div");
  bubble.className = "sensei-bubble";
  bubble.textContent = text;
  const gameArea = $("gameArea");
  if(gameArea && gameArea.appendChild){ gameArea.appendChild(bubble); } else { document.body.appendChild(bubble); }
  setTimeout(()=> bubble.remove(), 2300);
}

/* ============================================================
   OMIKUJI — undian keberuntungan harian, terinspirasi tradisi
   kuil Jepang sungguhan (menarik satu papan nasib per hari).
   Tingkatan asli: 大吉(Sangat Baik) > 吉(Baik) > 中吉 > 小吉 >
   末吉(Baik Nanti) > 凶(Kurang Baik, tetap dpt hiburan kecil).
   ============================================================ */
const OMIKUJI_TIERS = [
  { kanji: "大吉", name: "Daikichi — Sangat Beruntung!", weight: 5,  coins: 60, xp: 40, guaranteedCard: true,
    msg: "Hari ini segalanya akan berjalan lancar. Manfaatkan momentum ini!" },
  { kanji: "吉",   name: "Kichi — Beruntung", weight: 20, coins: 35, xp: 25, guaranteedCard: false,
    msg: "Keberuntungan menyertaimu. Waktu yang baik untuk belajar hal baru." },
  { kanji: "中吉", name: "Chūkichi — Cukup Beruntung", weight: 25, coins: 25, xp: 18, guaranteedCard: false,
    msg: "Usaha kecil hari ini akan membuahkan hasil besar nanti." },
  { kanji: "小吉", name: "Shōkichi — Sedikit Beruntung", weight: 25, coins: 18, xp: 12, guaranteedCard: false,
    msg: "Hal-hal baik datang perlahan. Tetap konsisten, ya!" },
  { kanji: "末吉", name: "Suekichi — Beruntung Nanti", weight: 15, coins: 12, xp: 10, guaranteedCard: false,
    msg: "Keberuntungan besar sedang menuju arahmu, bersabarlah." },
  { kanji: "凶",   name: "Kyō — Kurang Beruntung", weight: 10, coins: 8,  xp: 8, guaranteedCard: false,
    msg: "Hari yang menantang, tapi justru di situ kamu bisa belajar paling banyak." }
];
function omikujiKey(){ return `nafis_omikuji_${(student && student.nis) || "guest"}`; }
function hasDrawnOmikujiToday(){ return localStorage.getItem(omikujiKey()) === todayKey(); }
function drawOmikujiTier(){
  const totalW = OMIKUJI_TIERS.reduce((s,t)=>s+t.weight, 0);
  let r = Math.random() * totalW;
  for(const t of OMIKUJI_TIERS){ if(r < t.weight) return t; r -= t.weight; }
  return OMIKUJI_TIERS[OMIKUJI_TIERS.length-1];
}
function renderOmikujiSlot(){
  const slot = $("omikujiSlot");
  if(!slot) return;
  const done = hasDrawnOmikujiToday();
  slot.innerHTML = `
    <div class="omikuji-card ${done?'done':''}" id="omikujiCardBtn">
      <div class="om-icon">⛩️</div>
      <div class="om-mid">
        <div class="om-title">Omikuji Hari Ini</div>
        <div class="om-sub">${done ? 'Sudah ditarik — balik lagi besok!' : 'Tarik nasib keberuntunganmu, gratis!'}</div>
      </div>
      <div class="om-cta">${done ? '✓ Selesai' : 'Tarik ▶'}</div>
    </div>
  `;
  if(!done){
    $("omikujiCardBtn").addEventListener("click", openOmikuji);
  }
}
function openOmikuji(){
  if(hasDrawnOmikujiToday()) return;
  const el = document.createElement("div");
  el.className = "omikuji-overlay";
  el.innerHTML = `<div><div class="omikuji-box" id="omikujiBox">⛩️</div><div style="text-align:center;color:#fff;font-size:12px;font-weight:700;">Ketuk kotak untuk menarik nasib...</div></div>`;
  document.body.appendChild(el);
  el.querySelector("#omikujiBox").addEventListener("click", ()=>{
    localStorage.setItem(omikujiKey(), todayKey());
    const tier = drawOmikujiTier();
    playSFX('correct');
    awardXPCoins(tier.xp, tier.coins);
    let cardHtml = "";
    if(tier.guaranteedCard){
      // 大吉 menjamin kartu langka acak dari pool yang tersedia
      const pool = (VOCAB && VOCAB.length) ? VOCAB : PATTERNS;
      if(pool && pool.length){
        const pick = pool[Math.floor(Math.random()*pool.length)];
        setTimeout(()=> awardCard(pick, false), 900);
        cardHtml = `<div class="os-reward">🃏 + Kartu spesial "${pick.jp}"!</div>`;
      }
    }
    el.innerHTML = `
      <div class="omikuji-slip">
        <div class="os-fortune">${tier.kanji}</div>
        <div class="os-sub">${tier.name}</div>
        <div class="os-reward">✨ +${tier.xp} XP &nbsp; 🪙 +${tier.coins} koin</div>
        ${cardHtml}
        <div class="os-msg">"${tier.msg}"</div>
        <button class="omikuji-close" id="omikujiCloseBtn">Tutup</button>
      </div>
    `;
    spawnConfetti(window.innerWidth/2, window.innerHeight/2, tier.kanji==='大吉' ? 55 : 25);
    el.querySelector("#omikujiCloseBtn").addEventListener("click", ()=>{ el.remove(); renderOmikujiSlot(); });
  });
}

/* ============================================================
   FUSI KARTU — gabungkan 3 kartu duplikat jadi satu versi
   berkilau (Kirakira), dgn bonus koin. Dibuka dari Album.
   ============================================================ */
function fuseCard(jp){
  const coll = getCardCollection();
  const card = coll[jp];
  if(!card || card.count < 3 || card.evolved) return false;
  card.count -= 2; // 2 duplikat "dilebur", sisa 1 jadi versi kirakira
  card.evolved = true;
  saveCardCollection(coll);
  const p = getPlayerProfile();
  p.coins += 25;
  savePlayerProfile(p);
  showFusionResult(card);
  return true;
}
function showFusionResult(card){
  const el = document.createElement("div");
  el.className = "fusion-overlay";
  el.innerHTML = `
    <div class="fusion-result-card">
      <div class="fr-jp">✨ ${card.jp} ✨</div>
      <div class="fr-label">Berevolusi jadi versi Kirakira!<br>🪙 +25 koin bonus fusi</div>
      <button class="omikuji-close" id="fusionCloseBtn">Keren! ▶</button>
    </div>
  `;
  document.body.appendChild(el);
  playSFX('correct');
  spawnConfetti(window.innerWidth/2, window.innerHeight/2, 45);
  el.querySelector("#fusionCloseBtn").addEventListener("click", ()=> el.remove());
}

/* ============================================================
   MISI HARIAN — 3 misi acak (berdasar tanggal, jadi sama untuk
   semua siswa di hari yang sama tapi beda tiap hari), reset tiap
   hari. Progres & klaim otomatis begitu target tercapai.
   ============================================================ */
const MISSION_POOL = [
  { id: "answer15", icon: "✏️", label: "Jawab 15 soal hari ini", target: 15, xp: 20, coins: 15 },
  { id: "answer30", icon: "📝", label: "Jawab 30 soal hari ini", target: 30, xp: 35, coins: 25 },
  { id: "combo8",   icon: "🔥", label: "Raih combo x8 dalam 1 sesi", target: 8,  xp: 25, coins: 20 },
  { id: "perfect1", icon: "🎯", label: "Selesaikan 1 kuis dengan nilai sempurna", target: 1, xp: 30, coins: 25 },
  { id: "sessions2",icon: "🎮", label: "Mainkan 2 sesi kuis hari ini", target: 2, xp: 15, coins: 10 },
  { id: "dokkai1",  icon: "📖", label: "Selesaikan 1 kuis Dokkai (Bacaan)", target: 1, xp: 25, coins: 20 }
];
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dailyMissionsKey(){ return `nafis_missions_${(student && student.nis) || "guest"}_${todayKey()}`; }
function getTodayMissions(){
  try{
    const saved = JSON.parse(localStorage.getItem(dailyMissionsKey()));
    if(saved) return saved;
  }catch(e){}
  // pilih 3 misi acak, seed dari tanggal+nis biar konsisten sepanjang hari itu
  const rng = mulberry32(hashSeed(todayKey() + (student?student.nis:"guest")));
  const picked = shuffle(MISSION_POOL.slice(), rng).slice(0,3).map(m=>({ ...m, progress: 0, claimed: false }));
  const state = { date: todayKey(), missions: picked };
  localStorage.setItem(dailyMissionsKey(), JSON.stringify(state));
  return state;
}
function saveMissionsState(state){ localStorage.setItem(dailyMissionsKey(), JSON.stringify(state)); }

/* Tambah progres ke misi bertipe tertentu (dipanggil dari titik-titik
   relevan: tiap jawaban benar/salah -> 'answer'; combo tertentu ->
   'combo' (set nilai maksimum, bukan tambah); akhir sesi -> 'sessions',
   'perfect', 'dokkai'). Otomatis klaim & toast begitu target tercapai. */
function progressMission(kind, value){
  const state = getTodayMissions();
  let changed = false;
  state.missions.forEach(m=>{
    if(m.claimed) return;
    let matches = false;
    if(kind === 'answer' && (m.id==='answer15'||m.id==='answer30')) matches = true;
    if(kind === 'combo' && m.id==='combo8') matches = true;
    if(kind === 'sessions' && m.id==='sessions2') matches = true;
    if(kind === 'perfect' && m.id==='perfect1') matches = true;
    if(kind === 'dokkai' && m.id==='dokkai1') matches = true;
    if(!matches) return;
    if(kind === 'combo'){ m.progress = Math.max(m.progress, value); }
    else { m.progress += value; }
    changed = true;
    if(m.progress >= m.target && !m.claimed){
      m.claimed = true;
      setTimeout(()=> showGameToast(`✅ Misi selesai: ${m.label}! +${m.xp}XP +${m.coins} koin`), 300);
      awardXPCoins(m.xp, m.coins);
    }
  });
  if(changed) saveMissionsState(state);
  renderMissionsCard();
}

function renderMissionsCard(){
  const box = $("missionsCard");
  if(!box) return;
  const state = getTodayMissions();
  box.innerHTML = `
    <div class="mc-title">📋 Misi Hari Ini</div>
    ${state.missions.map(m=>`
      <div class="mission-row ${m.claimed?'done':''}">
        <span class="m-icon">${m.claimed?'✅':m.icon}</span>
        <div class="m-body">
          <div class="m-label">${m.label}</div>
          <div class="m-track"><div class="m-fill" style="width:${Math.min(100,Math.round(m.progress/m.target*100))}%"></div></div>
        </div>
        <div class="m-reward">+${m.xp}XP</div>
      </div>
    `).join("")}
  `;
}

let student = null;

function shuffle(arr, rng){
  rng = rng || Math.random;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ================= PAKET SOAL (deterministik, anti-nyontek) =================
   Menghasilkan angka acak yang SELALU SAMA untuk seed yang sama, supaya
   "Paket A" hari ini = "Paket A" besok (bisa dicetak jadi kunci jawaban),
   tapi tetap berbeda dari Paket B, Paket C, dst. */
function hashSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5)-h+str.charCodeAt(i); h |= 0; }
  return h>>>0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function levelClass(lvl){ return (lvl||'').toLowerCase(); }
function levelColor(lvl){
  if(lvl==='N2') return 'var(--n2)';
  if(lvl==='N3') return 'var(--n3)';
  if(lvl==='N4') return 'var(--n4)';
  return 'var(--n5)';
}

function showPage(page) {
  startBGM(); // navigasi dashboard (bukan sedang mengerjakan kuis) -> musik menyala
  document.querySelectorAll(".dashboard-layout > .panel").forEach(p => p.classList.remove("active"));

  if (page === 'game') {
    $("panel-game").classList.add("active");
    renderStart();
  } else if (page === 'study') {

/* ================= QUIZ SETUP ================= */
let setupScope = "all";
let setupCount = "50";
let setupType = "kotoba";
let setupMode = "latihan"; // "latihan" (acak bebas) | "ujian" (paket soal tetap)
let setupPacketIndex = 0;

function poolFor(scope, typeMode){
  const src = typeMode === 'bunpo' ? PATTERNS : (typeMode === 'dokkai' ? DOKKAI : (typeMode === 'jlpttest' ? JLPT_TEST : VOCAB));
  return src.filter(p=>matchesBook(p, scope));
}

function updateCountHint(){
  const pool = poolFor(setupScope, setupType);
  const el = document.getElementById('countHint');
  if(el) el.textContent = setupType === 'dokkai' ? `(tersedia ${pool.length} bacaan)` : `(tersedia ${pool.length} item)`;
}

/* Ambil n distraktor unik berdasar field, hindari duplikat nilai jawaban benar.
   Kalau pool utama kurang, lebar-kan pencarian ke seluruh data (lintas level). */
function pickDistractors(pool, widePool, correct, field, n, rng){
  const seen = new Set([correct[field]]);
  const out = [];
  const tryPool = (arr)=>{
    for(const c of shuffle(arr, rng)){
      if(out.length>=n) break;
      if(seen.has(c[field])) continue;
      seen.add(c[field]); out.push(c);
    }
  };
  tryPool(pool.filter(x=>x!==correct));
  if(out.length<n) tryPool(widePool.filter(x=>x!==correct));
  return out;
}

/* Arti tampilan: pakai versi Bahasa Indonesia (meaning_id) kalau sudah
   diterjemahkan, kalau belum jatuhkan ke 'meaning' bawaan (Inggris) sampai
   giliran level tsb diterjemahkan pada update berikutnya. */
function dispMeaning(item){ return item.meaning_id || item.meaning; }

/* Pecah kalimat contoh Jepang (yang sudah ditulis dengan spasi antar kata/
   partikel) menjadi potongan-potongan untuk mode "Menyusun Kalimat". */
function splitJpSentence(s){
  return s.trim().split(/\s+/).filter(Boolean);
}

/* Bangun 1 soal Bunpo dari 1 item "correct", dengan salah satu dari 3 tipe
   soal (masing-masing ~33% peluang), TANPA logika cara-baca/romaji:
   1) tebak_arti     : tampilkan pola (jp), pilihan ganda berisi arti (meaning_id)
   2) tebak_pola     : tampilkan arti (meaning_id), pilihan ganda berisi pola (jp)
   3) susun_kalimat  : tampilkan arti contoh (contoh_id), susun contoh_jp dari
                        potongan kata yang diacak */
function makeQuestionForPattern(correct, pool, wide, rng){
  rng = rng || Math.random;
  const canBuild = !!(correct.contoh_jp && correct.contoh_id && splitJpSentence(correct.contoh_jp).length >= 2);
  const variants = canBuild ? ['tebak_arti','tebak_pola','susun_kalimat'] : ['tebak_arti','tebak_pola'];
  const v = variants[Math.floor(rng()*variants.length)];

  if(v === 'tebak_pola'){
    const distractors = pickDistractors(pool, wide, correct, 'jp', 3, rng);
    const options = shuffle([correct, ...distractors], rng);
    return { type:v, correct, qText:`Pola kalimat mana yang berarti: <b>"${dispMeaning(correct)}"</b>?`, correctAns: correct.jp, options: options.map(o=>o.jp) };
  }
  if(v === 'susun_kalimat'){
    const chunks = splitJpSentence(correct.contoh_jp);
    return {
      type: v, correct,
      qText: `Susun kalimat bahasa Jepang yang artinya: <b>"${correct.contoh_id}"</b>`,
      chunks: shuffle(chunks, rng),
      correctChunks: chunks,
      correctAns: chunks.join(''),
      options: []
    };
  }
  // 'tebak_arti' (default/fallback)
  const distractors = pickDistractors(pool, wide, correct, 'meaning', 3, rng);
  const options = shuffle([correct, ...distractors], rng);
  return { type:'tebak_arti', correct, qText:`Apa arti dari pola kalimat: <b>${correct.jp}</b>?`, correctAns: dispMeaning(correct), options: options.map(dispMeaning) };
}

function makeQuestionForVocab(correct, pool, wide, rng){
  rng = rng || Math.random;
  // Kanji 1 huruf: hindari varian soal yang menguji cara baca (on'yomi
  // di field .romaji), karena on'yomi berdiri sendiri itu sulit ditebak
  // (baru natural kalau dalam kata majemuk). Cukup uji dari sisi arti saja.
  const isSingleKanji = correct.type === 'kanji' && correct.jp && correct.jp.length === 1;
  const variants = isSingleKanji
    ? ['meaning_to_word','word_to_meaning']
    : ['meaning_to_word','word_to_meaning','word_to_romaji','romaji_to_word'];
  const v = variants[Math.floor(rng()*variants.length)];
  const label = correct.type === 'kanji' ? 'kanji' : 'kata';
  if(v === 'meaning_to_word'){
    const distractors = pickDistractors(pool, wide, correct, 'jp', 3, rng);
    const options = shuffle([correct, ...distractors], rng);
    return { type:v, correct, qText:`Apa bahasa Jepangnya <b>"${dispMeaning(correct)}"</b>?`, correctAns: correct.jp, options: options.map(o=>o.jp) };
  }
  if(v === 'word_to_meaning'){
    const distractors = pickDistractors(pool, wide, correct, 'meaning', 3, rng);
    const options = shuffle([correct, ...distractors], rng);
    return { type:v, correct, qText:`Apa arti dari ${label} <b>${correct.jp}</b>?`, correctAns: dispMeaning(correct), options: options.map(dispMeaning) };
  }
  if(v === 'word_to_romaji' && correct.romaji){
    const distractors = pickDistractors(pool, wide, correct, 'romaji', 3, rng);
    if(distractors.length>=3){
      const options = shuffle([correct, ...distractors], rng);
      return { type:v, correct, qText:`Bagaimana cara membaca ${label} <b>${correct.jp}</b>?`, correctAns: correct.romaji, options: options.map(o=>o.romaji) };
    }
  }
  if(v === 'romaji_to_word' && correct.romaji){
    const distractors = pickDistractors(pool, wide, correct, 'jp', 3, rng);
    const options = shuffle([correct, ...distractors], rng);
    return { type:v, correct, qText:`Mana yang dibaca <b>${correct.romaji}</b>?`, correctAns: correct.jp, options: options.map(o=>o.jp) };
  }
  const distractorsV = pickDistractors(pool, wide, correct, 'meaning', 3, rng);
  const optionsV = shuffle([correct, ...distractorsV], rng);
  return { type:'word_to_meaning', correct, qText:`Apa arti dari ${label} <b>${correct.jp}</b>?`, correctAns: dispMeaning(correct), options: optionsV.map(dispMeaning) };
}

/* Soal Mode Dengar & Tebak: kata TIDAK ditampilkan di teks soal —
   siswa harus menebak artinya murni dari suara (Web Speech API).
   Selalu bentuk word->meaning (bukan salah satu dari 4 varian acak
   seperti kosakata biasa), supaya opsi jawaban tidak "membocorkan"
   tulisan Jepangnya. */
function makeQuestionForListening(correct, pool, wide, rng){
  rng = rng || Math.random;
  const distractors = pickDistractors(pool, wide, correct, 'meaning', 3, rng);
  const options = shuffle([correct, ...distractors], rng);
  return {
    type: 'listening_mc', correct,
    qText: `🎧 Dengarkan baik-baik, lalu pilih artinya`,
    correctAns: dispMeaning(correct),
    options: options.map(dispMeaning)
  };
}

function makeQuestionForJLPT(item, rng){
  rng = rng || Math.random;
  const options = shuffle(item.options.slice(), rng);
  const plainText = item.qText.replace(/<[^>]+>/g,'');
  const correct = { jp: plainText, meaning_id: `Jawaban: ${item.correctAns}`, level: item.level };
  return {
    type: 'jlpt_mc',
    correct,
    qText: `<span style="font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px;">[${item.section}]</span><br>${item.qText}`,
    correctAns: item.correctAns,
    options
  };
}

/* Bangun soal-soal Dokkai dari 1 "correct" (= 1 bacaan/passage).
   Berbeda dari pola/kosakata, 1 bacaan bisa menghasilkan BEBERAPA soal
   beruntun (mis. bacaan cloze punya soal ア/イ/ウ). Semua soal itu tetap
   menampilkan panel bacaan yang sama di atas, dengan indikator progres
   "Soal 2/3 dari bacaan ini" supaya siswa tahu masih dalam 1 bacaan. */
function makeQuestionsForDokkai(passage, rng){
  rng = rng || Math.random;
  const total = passage.questions.length;
  return passage.questions.map((sub, idx) => {
    // urutan pilihan diacak per-siswa/per-sesi supaya jawaban benar tidak selalu di posisi sama
    const options = shuffle(sub.options.slice(), rng);
    return {
      type: 'dokkai_mc',
      correct: passage, // dipakai renderQuestion utk ambil .level (badge warna level)
      passage,
      subIndex: idx,
      subTotal: total,
      qText: sub.qText,
      correctAns: sub.correctAns,
      options,
      explanation: sub.explanation || null,
      evidence: sub.evidence || null
    };
  });
}

function buildQuestions(scope, count, typeMode){
  const pool = poolFor(scope, typeMode);
  if(!pool.length) return [];
  const wide = typeMode === 'bunpo' ? PATTERNS : VOCAB;
  const n = count==="semua" ? pool.length : Math.min(parseInt(count), pool.length);
  const chosen = shuffle(pool).slice(0, n);
  if(typeMode === 'dokkai'){
    return chosen.flatMap(passage => makeQuestionsForDokkai(passage));
  }
  if(typeMode === 'jlpttest'){
    return chosen.map(item => makeQuestionForJLPT(item));
  }
  if(typeMode === 'listening'){
    return chosen.map(correct => makeQuestionForListening(correct, pool, wide));
  }
  return chosen.map(correct => typeMode === 'bunpo'
    ? makeQuestionForPattern(correct, pool, wide)
    : makeQuestionForVocab(correct, pool, wide));
}

/* ---------- MODE UJIAN: PAKET SOAL TETAP (anti-nyontek) ----------
   Prinsip: seluruh kosakata/pola dalam cakupan level dibagi RATA ke
   sejumlah paket (Paket A, B, C, ...) berukuran `count` soal, dengan
   urutan acak yang TETAP (deterministik) untuk kombinasi
   jenis+cakupan+jumlah-soal yang sama. Jadi:
   - 25 soal & pool ±500 item -> otomatis 20 paket, seluruh item terpakai.
   - 50 soal & pool ±500 item -> otomatis 10 paket.
   - 100 soal & pool ±500 item -> otomatis 5 paket.
   Jumlah paket menyesuaikan otomatis ke ukuran pool sebenarnya
   (per level N5/N4/N3/N2 jumlahnya berbeda-beda). */
function buildPacketPlan(scope, count, typeMode){
  const pool = poolFor(scope, typeMode);
  const L = pool.length;
  if(!L) return { packets:[], numPackets:0, n:0, L:0 };
  const n = count === "semua" ? L : Math.min(parseInt(count), L);
  const numPackets = count === "semua" ? 1 : Math.max(1, Math.ceil(L / n));
  const baseSeed = hashSeed(`${scope}|${typeMode}|${count}`);
  const rng = mulberry32(baseSeed);
  let extended = shuffle(pool, rng);
  let cycle = 1;
  while(extended.length < numPackets * n){
    extended = extended.concat(shuffle(pool, mulberry32(baseSeed + cycle*97)));
    cycle++;
  }
  const packets = [];
  for(let k=0;k<numPackets;k++){
    packets.push(extended.slice(k*n, k*n + n));
  }
  return { packets, numPackets, n, L };
}

function packetLabel(i){
  // 0 -> A, 1 -> B, ... 25 -> Z, 26 -> AA, dst. (dipakai internal utk seed acak,
  // tampilan ke siswa tetap "Level 1, Level 2, ..." — lihat levelDisplayLabel)
  let s = "";
  i++;
  while(i>0){ i--; s = String.fromCharCode(65 + (i%26)) + s; i = Math.floor(i/26); }
  return s;
}
function levelDisplayLabel(i){ return `Level ${i+1}`; }

/* ---------- SISTEM LOCK/UNLOCK LEVEL ----------
   Level berikutnya baru terbuka kalau level sebelumnya (di kombinasi
   cakupan+jenis+jumlah-soal yang SAMA) sudah pernah diselesaikan dengan
   akurasi >= 80%. Progres disimpan per siswa (kunci pakai NIS) di
   localStorage supaya tetap tersimpan walau ganti perangkat/tab asal
   NIS-nya sama. Level 1 selalu terbuka secara default. */
function levelProgressKey(){
  return `nafis_level_progress_${(student && student.nis) || "guest"}`;
}
function levelComboKey(){
  return `${setupScope}|${setupType}|${setupCount}`;
}
function getUnlockedLevelCount(){
  try{
    const all = JSON.parse(localStorage.getItem(levelProgressKey()) || "{}");
    return Math.max(1, all[levelComboKey()] || 1); // minimal 1 level selalu terbuka
  }catch(e){ return 1; }
}
function unlockNextLevelIfPassed(packetIndexJustPlayed, accuracyPercent){
  if(accuracyPercent < 80) return false;
  try{
    const key = levelProgressKey();
    const all = JSON.parse(localStorage.getItem(key) || "{}");
    const combo = levelComboKey();
    const currentUnlocked = Math.max(1, all[combo] || 1);
    // hanya maju kalau yang baru saja lulus adalah level paling depan (frontier)
    if(packetIndexJustPlayed + 1 === currentUnlocked){
      all[combo] = currentUnlocked + 1;
      localStorage.setItem(key, JSON.stringify(all));
      return true; // level baru saja terbuka
    }
  }catch(e){}
  return false;
}

function buildQuestionsForPacket(scope, count, typeMode, packetIndex){
  const plan = buildPacketPlan(scope, count, typeMode);
  const items = plan.packets[packetIndex] || [];
  const pool = poolFor(scope, typeMode);
  const wide = typeMode === 'bunpo' ? PATTERNS : VOCAB;
  const rng = mulberry32(hashSeed(`${scope}|${typeMode}|${count}|variant|${packetIndex}`));
  if(typeMode === 'dokkai'){
    return items.flatMap(passage => makeQuestionsForDokkai(passage, rng));
  }
  if(typeMode === 'jlpttest'){
    return items.map(item => makeQuestionForJLPT(item));
  }
  if(typeMode === 'listening'){
    return items.map(correct => makeQuestionForListening(correct, pool, wide, rng));
  }
  return items.map(correct => typeMode === 'bunpo'
    ? makeQuestionForPattern(correct, pool, wide, rng)
    : makeQuestionForVocab(correct, pool, wide, rng));
}

/* Tampilkan kotak pilihan "Level 1 / Level 2 / ..." kalau Mode Ujian aktif.
   Jumlah level dihitung otomatis dari total kosakata/pola di cakupan level
   yang dipilih, dibagi jumlah soal per level -> semua item pasti terpakai.
   Level yang belum di-unlock ditampilkan terkunci (🔒) dan tidak bisa diklik;
   syarat buka level berikutnya: akurasi >= 80% di level sebelumnya. */
function renderPacketRow(){
  const box = $("packetBox");
  if(!box) return;
  if(setupMode !== "ujian"){ box.style.display = "none"; return; }
  box.style.display = "";
  const plan = buildPacketPlan(setupScope, setupCount, setupType);
  const unlockedCount = Math.min(getUnlockedLevelCount(), plan.numPackets);
  const unitWord = setupType === 'dokkai' ? 'bacaan' : 'item';
  $("packetHint").textContent = `(${plan.numPackets} level &middot; ${plan.L} ${unitWord} terbagi rata &middot; min. 80% utk buka level berikutnya)`;
  const row = $("packetRow");
  if(setupPacketIndex >= plan.numPackets) setupPacketIndex = 0;
  if(setupPacketIndex >= unlockedCount) setupPacketIndex = unlockedCount - 1;

  // jalur zig-zag: posisi kiri/tengah/kanan bergantian tiap node, biar
  // terasa seperti peta stage di game (Candy Crush/Duolingo-style)
  const posCycle = ["pos-c","pos-r","pos-c","pos-l"];
  row.innerHTML = Array.from({length: plan.numPackets}, (_,i)=>{
    const locked = i >= unlockedCount;
    const cleared = i < unlockedCount - 1; // sudah pernah dilewati (bukan garis depan)
    const isPicked = (i === setupPacketIndex && !locked);
    const isBossLevel = (i+1) % 5 === 0; // tiap level ke-5 jadi "milestone" lebih besar
    const pos = posCycle[i % posCycle.length];
    const nodeCls = ["level-node"];
    if(isBossLevel) nodeCls.push("boss-node");
    if(locked) nodeCls.push("locked");
    else if(cleared) nodeCls.push("cleared");
    else nodeCls.push("unlocked");
    if(isPicked) nodeCls.push("active-pick");
    const connector = i > 0 ? `<div class="level-connector ${i <= unlockedCount-1 ? 'done' : ''}"></div>` : "";
    return `
      <div class="level-node-row ${pos}">
        ${connector}
        <div class="${nodeCls.join(' ')}" data-v="${i}" title="${locked ? 'Selesaikan level sebelumnya dgn nilai min. 80% dulu' : levelDisplayLabel(i)}">
          ${cleared ? '<span class="ln-star">⭐</span>' : ""}
          ${locked ? '🔒' : (i+1)}
          <span class="ln-sub">${locked ? '' : (isBossLevel ? 'BOSS' : 'LV')}</span>
        </div>
      </div>`;
  }).join("");

  document.querySelectorAll(".level-node").forEach(node=>{
    if(node.classList.contains("locked")) return;
    node.addEventListener("click", ()=>{
      document.querySelectorAll(".level-node").forEach(n=>n.classList.remove("active-pick"));
      node.classList.add("active-pick");
      setupPacketIndex = parseInt(node.dataset.v);
      playSFX('correct');
    });
  });
}

let gState = null;
function startGame(){
  playSFX('start');
  // Ganti musik sesuai mode yg dipilih (aransemen pentatonik ala Jepang,
  // beda tempo/nuansa tiap mode). Khusus Dengar & Tebak: TANPA musik
  // sama sekali (gameModeBgmTheme mengembalikan null), biar tidak
  // mengganggu konsentrasi mendengar.
  const bgmTheme = gameModeBgmTheme(setupMode, setupType);
  setBgmTheme(bgmTheme);
  if(bgmTheme){ startBGM(); duckBGM(0.35); }
  const isTimeAttack = setupMode === "timeattack";
  // Serbu Waktu: pakai SEMUA soal yang tersedia (biar 60 detik tidak
  // kehabisan soal di tengah jalan), tanpa sistem paket level.
  const qs = setupMode === "ujian"
    ? buildQuestionsForPacket(setupScope, setupCount, setupType, setupPacketIndex)
    : buildQuestions(setupScope, isTimeAttack ? "semua" : setupCount, setupType);
  if(qs.length === 0) {
    alert("Maaf, belum ada soal untuk filter tersebut."); return;
  }

  gState = {
    questions: qs,
    qi: 0, score: 0, streak: 0, correctCount: 0, misses: [],
    timer: null, timeLeft: 20, timeTotal: 20, locked: false,
    startedAt: new Date(),
    paketLabel: setupMode === "ujian" ? levelDisplayLabel(setupPacketIndex) : (isTimeAttack ? "Serbu Waktu" : null),
    powerups: { fifty: 1, skip: 1, freeze: 1 }, // modal awal power-up per sesi, nambah tiap combo 5x
    maxStreak: 0,
    bossIndex: (!isTimeAttack && qs.length >= 3) ? qs.length - 1 : -1, // Serbu Waktu tak pakai boss (durasi sudah jadi tantangan utamanya)
    bossShown: false,
    isTimeAttack,
    sessionTimer: null, sessionTimeLeft: 60, sessionTimeTotal: 60
  };

  if(isTimeAttack) startSessionCountdown();
  renderQuestion();
}

/* ---------- MODE SERBU WAKTU: hitung mundur sesi 60 detik ----------
   Terpisah dari timer per-soal biasa; begitu habis, kuis otomatis
   selesai dan lompat ke layar hasil — berapa pun soal yang sudah
   dijawab. Kalau soal di pool habis duluan, pool diacak ulang &
   dilanjutkan (looping) supaya tidak pernah kehabisan soal di
   tengah 60 detik. */
function startSessionCountdown(){
  clearInterval(gState.sessionTimer);
  gState.sessionTimer = setInterval(()=>{
    if(!gState || !gState.isTimeAttack) { clearInterval(gState.sessionTimer); return; }
    gState.sessionTimeLeft -= 0.1;
    const fill = $("sessionTimerFill");
    const label = $("sessionTimerLabel");
    if(fill) fill.style.width = Math.max(0, gState.sessionTimeLeft/gState.sessionTimeTotal*100) + "%";
    if(label) label.textContent = Math.max(0, Math.ceil(gState.sessionTimeLeft)) + "s";
    if(gState.sessionTimeLeft <= 0){
      clearInterval(gState.sessionTimer);
      clearInterval(gState.timer);
      renderResult();
    }
  }, 100);
}

/* ============================================================
   MODE COCOK KARTU (MEMORY MATCH) — mini-game terpisah total dari
   mesin kuis pilihan-ganda. State & alur sendiri (gMem), tapi tetap
   pakai fungsi reward yang sama (XP/koin/kartu) biar konsisten dgn
   sistem meta-game yang sudah ada.
   ============================================================ */
let gMem = null;
const MEM_PAIRS_TARGET = 6; // 6 pasang = 12 kartu, pas utk grid 3 kolom

function startMemoryMatch(){
  playSFX('start');
  const bgmTheme = gameModeBgmTheme('memory', setupType);
  setBgmTheme(bgmTheme);
  if(bgmTheme){ startBGM(); duckBGM(0.35); }
  const rawPool = setupType === 'bunpo'
    ? PATTERNS.filter(p=>matchesBook(p, setupScope))
    : VOCAB.filter(v=>matchesBook(v, setupScope));
  if(rawPool.length < 3){
    alert("Maaf, kata untuk cakupan ini terlalu sedikit buat mode Cocok Kartu."); return;
  }
  const n = Math.min(MEM_PAIRS_TARGET, rawPool.length);
  const chosen = shuffle(rawPool.slice()).slice(0, n);
  const cards = [];
  chosen.forEach((item, pairId)=>{
    cards.push({ pairId, side: 'jp', text: item.jp, item, matched: false });
    cards.push({ pairId, side: 'meaning', text: dispMeaning(item), item, matched: false });
  });
  gMem = {
    cards: shuffle(cards),
    flipped: [], matchedPairs: 0, totalPairs: n, moves: 0,
    timeLeft: 90, timeTotal: 90, timer: null, locked: false,
    startedAt: new Date()
  };
  gMem.timer = setInterval(()=>{
    gMem.timeLeft -= 0.1;
    const fill = $("memTimerFill"), label = $("memTimerLabel");
    if(fill) fill.style.width = Math.max(0, gMem.timeLeft/gMem.timeTotal*100) + "%";
    if(label) label.textContent = Math.max(0, Math.ceil(gMem.timeLeft)) + "s";
    if(gMem.timeLeft <= 0){ clearInterval(gMem.timer); endMemoryMatch(false); }
  }, 100);
  renderMemoryMatch();
}

function renderMemoryMatch(){
  $("gameArea").innerHTML = `
    <div class="quiz-avatar" id="quizAvatar">${currentAvatarEmoji()}</div>
    <div class="mem-hud">
      <span class="mh-timer">⏱️ <span id="memTimerLabel">${Math.ceil(gMem.timeLeft)}s</span></span>
      <span>🎯 ${gMem.matchedPairs}/${gMem.totalPairs} pasang</span>
      <span class="mh-moves">👆 ${gMem.moves}x</span>
    </div>
    <div class="session-timer-track" style="margin-bottom:12px;"><div class="session-timer-fill" id="memTimerFill" style="width:${gMem.timeLeft/gMem.timeTotal*100}%"></div></div>
    <div class="mem-grid" id="memGrid">
      ${gMem.cards.map((c,i)=>`
        <div class="mem-card ${c.side==='jp'?'jp-card':''} ${c.matched?'matched':''} ${gMem.flipped.includes(i)?'flipped':''}" data-i="${i}">
          <div class="mem-card-inner">
            <div class="mem-face back">?</div>
            <div class="mem-face front">${c.text}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
  document.querySelectorAll(".mem-card").forEach(el=>{
    el.addEventListener("click", ()=> flipMemoryCard(parseInt(el.dataset.i)));
  });
}

function flipMemoryCard(idx){
  if(gMem.locked) return;
  const card = gMem.cards[idx];
  if(card.matched || gMem.flipped.includes(idx)) return;
  gMem.flipped.push(idx);
  const el = document.querySelector(`.mem-card[data-i="${idx}"]`);
  if(el) el.classList.add("flipped");

  if(gMem.flipped.length === 2){
    gMem.locked = true;
    gMem.moves++;
    const [i1, i2] = gMem.flipped;
    const c1 = gMem.cards[i1], c2 = gMem.cards[i2];
    if(c1.pairId === c2.pairId){
      // cocok!
      playSFX('correct');
      c1.matched = true; c2.matched = true;
      gMem.matchedPairs++;
      document.querySelectorAll(`.mem-card[data-i="${i1}"], .mem-card[data-i="${i2}"]`).forEach(e=>e.classList.add("matched"));
      spawnConfetti(window.innerWidth/2, window.innerHeight/3, 18);
      setTimeout(()=> awardCard(c1.item, false), 400);
      gMem.flipped = [];
      gMem.locked = false;
      if(gMem.matchedPairs >= gMem.totalPairs){
        clearInterval(gMem.timer);
        setTimeout(()=> endMemoryMatch(true), 500);
      }
    } else {
      // tidak cocok
      playSFX('wrong');
      document.querySelectorAll(`.mem-card[data-i="${i1}"], .mem-card[data-i="${i2}"]`).forEach(e=>e.classList.add("wrong-flash"));
      setTimeout(()=>{
        document.querySelectorAll(`.mem-card[data-i="${i1}"], .mem-card[data-i="${i2}"]`).forEach(e=>{
          e.classList.remove("flipped","wrong-flash");
        });
        gMem.flipped = [];
        gMem.locked = false;
      }, 750);
    }
  }
}

function endMemoryMatch(won){
  clearInterval(gMem.timer);
  setBgmTheme('latihan');
  restoreBGMVolume();
  const timeBonus = Math.max(0, Math.round(gMem.timeLeft));
  const movesPenalty = Math.max(0, (gMem.moves - gMem.totalPairs) * 2);
  const score = Math.max(0, gMem.matchedPairs * 30 + timeBonus - movesPenalty);
  const acc = gMem.moves > 0 ? Math.round(gMem.matchedPairs / gMem.moves * 100) : 0;
  const earnedXP = gMem.matchedPairs * 4 + (won ? 15 : 0);
  const earnedCoins = gMem.matchedPairs * 3 + (won ? 10 : 0);
  awardXPCoins(earnedXP, earnedCoins);
  progressMission('sessions', 1);

  saveHistoryToLocal({
    tanggal: new Date().toLocaleString("id-ID"),
    jenis: "Cocok Kartu (Memory)",
    paket: "-",
    skor: score,
    benar: gMem.matchedPairs,
    total: gMem.totalPairs,
    akurasi: acc,
    nilai: gradeFor(acc).letter
  });

  const grade = gradeFor(acc);
  startBGM();
  $("gameArea").innerHTML = `
    <div class="result">
      <div class="grade-badge" style="background:${grade.color}22;color:${grade.color};border:2px solid ${grade.color};">${grade.letter}</div>
      <div class="id-line" style="font-size:22px;">${currentAvatarEmoji()}</div>
      <div class="id-line">${student.nama} &middot; NIS ${student.nis}</div>
      <div class="id-line" style="opacity:.8;">🎴 Cocok Kartu (Memory)</div>
      <div class="big-score">${score}</div>
      <div class="sub">${won ? '🎉 Semua pasangan ditemukan!' : '⏰ Waktu habis'} &middot; ${gMem.matchedPairs}/${gMem.totalPairs} pasang &middot; ${gMem.moves}x klik</div>
      <div class="sub" style="color:var(--gold);font-weight:700;">✨ +${earnedXP} XP &middot; 🪙 +${earnedCoins} koin</div>
      <button class="play-btn" id="memAgainBtn" style="margin-top:10px;">↻ Main Lagi</button>
    </div>
  `;
  $("memAgainBtn").addEventListener("click", ()=>{ playSFX('click'); renderStart(); });
}

/* Waktu pengerjaan bacaan dokkai mengikuti standar durasi resmi JLPT
   per level (dalam detik), dihitung TOTAL untuk satu paket bacaan
   (passage + semua sub-soalnya) — bukan per soal:
     N5 = 90 detik, N4 = 150 detik, N3 = 210 detik, N2 = 270 detik.
   Soal pertama (baca awal passage) diberi porsi lebih besar (40%)
   karena di situlah siswa membaca teksnya; sisa soal berikutnya
   membagi rata sisa waktu. Jumlahnya tetap pas dengan total resmi. */
function dokkaiTotalTimeForLevel(level){
  switch(level){
    case "N5": return 90;
    case "N4": return 150;
    case "N3": return 210;
    case "N2": return 270;
    default: return 150;
  }
}
function dokkaiQTime(q){
  const total = dokkaiTotalTimeForLevel(q.passage.level);
  const n = q.subTotal || 1;
  if(n <= 1) return total;
  const first = Math.round(total * 0.4);
  const rest = Math.max(10, Math.round((total - first) / (n - 1)));
  return q.subIndex === 0 ? first : rest;
}

    </div>
    ${bodyHtml}
    <div id="dokkaiExplainWrap"></div>
  `;

  $("puFifty").addEventListener("click", usePowerupFifty);
  $("puSkip").addEventListener("click", usePowerupSkip);
  $("puFreeze").addEventListener("click", usePowerupFreeze);

  if(q.type === 'listening_mc'){
    let tries = 0;
    const maxTries = 3;
    const playBtn = $("listenPlayBtn");
    const playSound = ()=>{
      if(tries >= maxTries) return;
      tries++;
      const triesEl = $("listenTries");
      if(triesEl) triesEl.textContent = tries;
      playBtn.classList.add("playing");
      speakJapanese(preferredReadingFor(q.correct), q.correct.level);
      setTimeout(()=> playBtn.classList.remove("playing"), 900);
      if(tries >= maxTries) playBtn.disabled = true;
    };
    playBtn.addEventListener("click", playSound);
    playSound(); // otomatis putar sekali begitu soal muncul
  }

  if(q.type === 'susun_kalimat'){
    setupSusunKalimat(q);
  } else {
    document.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click", ()=> selectMCAnswer(btn.dataset.v === q.correctAns, btn));
    });
  }

  const fill = $("timerFill");
  gState.timer = setInterval(()=>{
    gState.timeLeft -= 0.1;
    const pct = Math.max(0, (gState.timeLeft/gState.timeTotal)*100);
    fill.style.width = pct+"%";
    if(pct < 30) fill.classList.add("danger"); else fill.classList.remove("danger");
    if(gState.timeLeft <= 0){
      clearInterval(gState.timer);
      if(q.type === 'susun_kalimat') revealSusunKalimat(false);
      else selectMCAnswer(false, null);
    }
  }, 100);
}

/* Highlight bagian teks bacaan yg jadi bukti jawaban (dipakai di panel
   penjelasan setelah siswa menjawab soal dokkai). Pencarian string biasa
   (bukan regex) supaya aman dari karakter spesial pada teks Jepang. */
function highlightEvidence(passageText, evidence){
  if(!evidence) return passageText;
  const idx = passageText.indexOf(evidence);
  if(idx === -1) return passageText;
  return passageText.slice(0,idx) + "<mark>" + evidence + "</mark>" + passageText.slice(idx+evidence.length);
}

/* ---------- MODE SOAL PILIHAN GANDA ---------- */
/* ---------- POWER-UP: 50/50, Skip, +10 detik ---------- */
function usePowerupFifty(){
  if(gState.locked || gState.powerups.fifty<=0) return;
  const q = gState.questions[gState.qi];
  if(q.type === 'susun_kalimat') return;
  gState.powerups.fifty--;
  const wrongBtns = Array.from(document.querySelectorAll(".opt")).filter(b=>b.dataset.v !== q.correctAns);
  shuffle(wrongBtns).slice(0,2).forEach(b=>{ b.classList.add("opt-eliminated"); b.disabled = true; });
  $("puFifty").disabled = true;
  playSFX('correct');
}
function usePowerupSkip(){
  if(gState.locked || gState.powerups.skip<=0) return;
  gState.powerups.skip--;
  gState.locked = true;
  clearInterval(gState.timer);
  showGameToast("⏭️ Soal dilewati, combo tetap aman!");
  setTimeout(()=>{
    if(gState.qi < gState.questions.length-1){ gState.qi++; renderQuestion(); }
    else renderResult();
  }, 500);
}
function usePowerupFreeze(){
  if(gState.locked || gState.powerups.freeze<=0) return;
  gState.powerups.freeze--;
  gState.timeLeft += 10;
  gState.timeTotal += 10;
  $("puFreeze").disabled = true;
  showGameToast("⏱️ +10 detik!");
  playSFX('correct');
}

function selectMCAnswer(isCorrect, btnEl){
  if(gState.locked) return;
  gState.locked = true;
  clearInterval(gState.timer);

  const q = gState.questions[gState.qi];
  document.querySelectorAll(".opt").forEach(btn=>{
    if(btn.dataset.v === q.correctAns){
      btn.classList.add("correct");
      if(isCorrect) btn.classList.add("correct-pop"); // class kedua HANYA ditambah kalau memang perlu (string kosong bikin classList.add() error di browser sungguhan!)
    }
    else if(btn===btnEl) btn.classList.add("wrong", "wrong-pop");
  });

  handleAnswerResult(isCorrect, btnEl);
}

/* ---------- MODE SOAL MENYUSUN KALIMAT ---------- */
function setupSusunKalimat(q){
  gState.susunPicked = []; // urutan potongan kata yang sudah diklik siswa
  renderSusunUI(q);
  $("resetSusunBtn").addEventListener("click", ()=>{
    if(gState.locked) return;
    gState.susunPicked = [];
    renderSusunUI(q);
  });
}

function renderSusunUI(q){
  const pickedSet = gState.susunPicked;
  $("assemblyArea").innerHTML = pickedSet.length
    ? pickedSet.map((idx,i)=>`<button class="chunk-btn placed" data-idx="${idx}">${q.chunks[idx]}</button>`).join("")
    : `<span class="assembly-placeholder">Ketuk kata di bawah untuk menyusun kalimat...</span>`;

  $("chunkArea").innerHTML = q.chunks.map((c,idx)=>{
    const used = pickedSet.includes(idx);
    return `<button class="chunk-btn${used?' used':''}" data-idx="${idx}" ${used?'disabled':''}>${c}</button>`;
  }).join("");

  document.querySelectorAll("#chunkArea .chunk-btn:not(.used)").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(gState.locked) return;
      gState.susunPicked.push(parseInt(btn.dataset.idx));
      renderSusunUI(q);
      if(gState.susunPicked.length === q.chunks.length){
        const userAns = gState.susunPicked.map(i=>q.chunks[i]).join('');
        revealSusunKalimat(userAns === q.correctAns);
      }
    });
  });
  document.querySelectorAll("#assemblyArea .chunk-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(gState.locked) return;
      const idx = parseInt(btn.dataset.idx);
      gState.susunPicked = gState.susunPicked.filter(i=>i!==idx);
      renderSusunUI(q);
    });
  });
}

function revealSusunKalimat(isCorrect){
  if(gState.locked) return;
  gState.locked = true;
  clearInterval(gState.timer);
  const q = gState.questions[gState.qi];
  $("assemblyArea").innerHTML = `<div class="susun-result ${isCorrect?'correct':'wrong'}">${q.correctChunks.join(' ')}</div>`;
  $("chunkArea").innerHTML = "";
  handleAnswerResult(isCorrect, $("assemblyArea"));
}

/* ---------- LOGIKA BERSAMA: skor, streak, lanjut ke soal berikutnya ---------- */
function handleAnswerResult(isCorrect, anchorEl){
  const q = gState.questions[gState.qi];
  const isBoss = gState.qi === gState.bossIndex;
  progressMission('answer', 1);

  // --- Mode Dengar & Tebak: ungkap tulisan & cara baca kata setelah dijawab ---
  if(q.type === 'listening_mc'){
    const reveal = $("listenReveal");
    if(reveal){
      reveal.style.display = "block";
      reveal.innerHTML = `${q.correct.jp}${q.correct.romaji ? `<div class="lr-romaji">${q.correct.romaji}</div>` : ""}`;
    }
  }

  // --- avatar bereaksi ---
  const avatarEl = $("quizAvatar");
  if(avatarEl){
    avatarEl.classList.remove("reaction-happy", "reaction-sad");
    void avatarEl.offsetWidth;
    avatarEl.classList.add(isCorrect ? "reaction-happy" : "reaction-sad");
  }

  if(isCorrect){
    playSFX('correct');
    gState.streak++;
    gState.maxStreak = Math.max(gState.maxStreak, gState.streak);
    gState.correctCount++;
    let gained = 10 + Math.min(gState.streak-1,5)*2;
    if(isBoss) gained *= 2; // poin ganda di soal bos
    gState.score += gained;
    progressMission('combo', gState.streak);

    // --- game juice: confetti + popup skor ---
    const rect = anchorEl ? anchorEl.getBoundingClientRect() : {left: window.innerWidth/2, top: window.innerHeight/2, width:0};
    spawnConfetti(rect.left + rect.width/2, rect.top, isBoss ? 45 : 22);
    showScorePopup(gained, $("scoreHud"));
    $("scoreHud").textContent = "⭐ " + gState.score;
    const streakHud = $("streakHud");
    if(streakHud) streakHud.textContent = gState.streak>1 ? "🔥 Streak x"+gState.streak : "";
    if(isBoss) showGameToast("⚔️ Boss dikalahkan! Poin ganda +"+gained);

    // --- kartu Kotodama untuk kata/soal yang baru saja dijawab benar ---
    const cardSubject = q.type === 'dokkai_mc'
      ? { jp: q.passage.title, meaning_id: 'Bacaan Dokkai', level: q.passage.level }
      : q.correct;
    setTimeout(()=> awardCard(cardSubject, isBoss), isBoss ? 900 : 500);

    // --- komentar sensei ---
    showSenseiBubble(isBoss ? 'bossWin' : (gState.streak>=10 ? 'streak10' : (gState.streak>=5 ? 'streak5' : 'correct')));

    // --- combo popup + hadiah power-up tiap kelipatan 5 streak ---
    if(gState.streak > 0 && gState.streak % 5 === 0){
      showComboPopup(gState.streak);
      const puKeys = ['fifty','skip','freeze'];
      const pick = puKeys[Math.floor(Math.random()*puKeys.length)];
      gState.powerups[pick]++;
      setTimeout(()=> showGameToast("🎁 Combo hadiah! +1 power-up "+(pick==='fifty'?'50/50':pick==='skip'?'Skip':'+10s')), 700);
    }
  } else {
    playSFX('wrong');
    gState.streak = 0;
    shakeScreen();
    if(isBoss) showGameToast("💥 Boss lolos... coba lagi lain kali!");
    showSenseiBubble(isBoss ? 'bossLose' : 'wrong');
    // Ringkasan yang dipakai ulang di panel "Perlu diulang" (renderResult).
    // Dibuat seragam (selalu punya .jp & .meaning) meski sumbernya berbeda-beda
    // (pola kalimat / kosakata-kanji / bacaan dokkai), supaya render tidak pecah.
    if(q.type === 'dokkai_mc'){
      gState.misses.push({ jp: q.passage.title, meaning: q.qText.replace(/<[^>]+>/g,'') + ' → ' + q.correctAns });
    } else {
      gState.misses.push({ jp: q.correct.jp, meaning: dispMeaning(q.correct) });
    }
  }

  const goNext = ()=>{
    if(gState.isTimeAttack){
      // Serbu Waktu: sesi hanya berakhir kalau WAKTU habis (ditangani
      // startSessionCountdown), bukan krn soal habis -> looping terus.
      if(gState.sessionTimeLeft <= 0) return; // sudah/segera ditutup oleh countdown sesi
      gState.qi++;
      if(gState.qi >= gState.questions.length){
        // pool habis duluan drpd waktu -> acak ulang & lanjutkan
        gState.questions = gState.questions.concat(shuffle(gState.questions.slice()));
      }
      renderQuestion();
      return;
    }
    if(gState.qi < gState.questions.length-1){
      gState.qi++;
      renderQuestion();
    } else {
      renderResult();
    }
  };

  // Soal Dokkai: tampilkan penjelasan + highlight bukti di teks bacaan,
  // siswa lanjut manual (bukan auto-advance) supaya sempat baca penjelasan.
  if(q.type === 'dokkai_mc'){
    const passageEl = document.querySelector('.dokkai-text');
    if(passageEl && q.evidence) passageEl.innerHTML = highlightEvidence(q.passage.passage, q.evidence);
    const wrap = $("dokkaiExplainWrap");
    if(wrap){
      wrap.innerHTML = `
        <div class="dokkai-explain ${isCorrect ? '' : 'wrong'}">
          <div class="tag">${isCorrect ? '✅ Benar!' : '❌ Kurang tepat'}</div>
          <div class="body">${q.explanation ? q.explanation : (isCorrect ? 'Jawabanmu tepat.' : 'Jawaban yang benar: <b>'+q.correctAns+'</b>')}</div>
        </div>
        <button class="continue-btn" id="dokkaiContinueBtn">${gState.qi < gState.questions.length-1 ? 'Lanjut ▶' : 'Lihat Hasil ▶'}</button>
      `;
      $("dokkaiContinueBtn").addEventListener("click", goNext);
      wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
    } else {
      setTimeout(goNext, 650);
    }
    return;
  }

  setTimeout(goNext, 650);
}

function gradeFor(pct){
  if(pct>=90) return {letter:"A", color:"var(--mint)"};
  if(pct>=75) return {letter:"B", color:"var(--n5)"};
  if(pct>=60) return {letter:"C", color:"var(--gold)"};
  if(pct>=40) return {letter:"D", color:"var(--n4)"};
  return {letter:"E", color:"var(--red)"};
}

function renderResult(){
  if(gState.sessionTimer) clearInterval(gState.sessionTimer); // jaga2 kalau renderResult terpanggil lebih dari sekali
  setBgmTheme('latihan');
  startBGM(); // kuis sudah selesai -> musik latar menyala lagi
  restoreBGMVolume();
  // Serbu Waktu: pool soal bisa "digandakan" via looping saat waktu blm habis,
  // jadi questions.length TIDAK mencerminkan jumlah soal yg benar2 dijawab.
  // Total sebenarnya = benar + salah (keduanya sudah pasti tercatat).
  const total = gState.isTimeAttack ? (gState.correctCount + gState.misses.length) : gState.questions.length;
  const acc = total > 0 ? Math.round((gState.correctCount/total)*100) : 0;
  const grade = gradeFor(acc);
  const dateStr = gState.startedAt.toLocaleString("id-ID");

  const materiLabel = setupType === 'bunpo' ? 'Pola Kalimat' : (setupType === 'dokkai' ? 'Dokkai (Bacaan)' : (setupType === 'jlpttest' ? 'Tes Kosakata (JLPT)' : (setupType === 'listening' ? '🎧 Dengar & Tebak' : 'Kosakata & Kanji')));

  let justUnlocked = false;
  if(setupMode === "ujian"){
    justUnlocked = unlockNextLevelIfPassed(setupPacketIndex, acc);
  }

  // --- meta-game: XP/koin sesi ini, progres misi harian ---
  const earnedXP = gState.correctCount * 3 + Math.round(acc/10);
  const earnedCoins = gState.correctCount * 2 + (gState.maxStreak>=5 ? 10 : 0);
  awardXPCoins(earnedXP, earnedCoins);
  progressMission('sessions', 1);
  if(acc === 100) progressMission('perfect', 1);
  if(setupType === 'dokkai') progressMission('dokkai', 1);

  saveHistoryToLocal({
    tanggal: dateStr,
    jenis: materiLabel,
    paket: gState.paketLabel || '-',
    skor: gState.score,
    benar: gState.correctCount,
    total: total,
    akurasi: acc,
    nilai: grade.letter
  });

  sendToGoogleSheet(materiLabel + (gState.paketLabel ? ' ('+gState.paketLabel+')' : ''), dateStr);

  // --- papan skor lokal (per kombinasi cakupan+jenis+jumlah soal) ---
  const lbRecord = { nama: student.nama, nis: student.nis, score: gState.score, acc, dateStr };
  const leaderboard = saveToLeaderboard(lbRecord);
  const myRank = leaderboard.findIndex(r => r.nis===student.nis && r.score===gState.score && r.dateStr===dateStr);

  // --- pencapaian/achievement yang baru terbuka sesi ini ---
  const achievements = [];
  if(acc === 100) achievements.push({icon:"🎯", label:"Nilai Sempurna"});
  if(gState.maxStreak >= 10) achievements.push({icon:"🔥", label:"Combo Master"});
  if(gState.score >= 500) achievements.push({icon:"💯", label:"Skor Tinggi"});
  if(myRank === 0) achievements.push({icon:"🏆", label:"Juara Papan Skor"});
  try{
    const histLen = JSON.parse(localStorage.getItem("nafis_history")||"[]").length;
    if(histLen === 10 || histLen === 25 || histLen === 50) achievements.push({icon:"📚", label:"Pemain Setia ("+histLen+"x)"});
  }catch(e){}

  const leaderboardHtml = leaderboard.length ? `
    <div class="leaderboard">
      <div class="lb-title">🏆 Papan Skor — ${materiLabel}${gState.paketLabel ? ' ('+gState.paketLabel+')' : ''}</div>
      ${leaderboard.slice(0,5).map((r,i)=>`
        <div class="lb-row ${i===myRank?'me':''}">
          <span class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)}</span>
          <span class="lb-name">${r.nama}</span>
          <span class="lb-score">${r.score}</span>
        </div>
      `).join("")}
    </div>
  ` : "";

  const achvHtml = achievements.length ? `
    <div class="achv-row">
      ${achievements.map(a=>`<div class="achv-badge">${a.icon} ${a.label}</div>`).join("")}
    </div>
  ` : "";

  $("gameArea").innerHTML = `
    <div class="result">
      <div class="grade-badge" style="background:${grade.color}22;color:${grade.color};border:2px solid ${grade.color};">${grade.letter}</div>
      <div class="id-line" style="font-size:22px;">${currentAvatarEmoji()}</div>
      <div class="id-line">${student.nama} &middot; NIS ${student.nis}${student.kelas ? " &middot; "+student.kelas : ""}</div>
      ${gState.paketLabel ? `<div class="id-line" style="opacity:.8;">${gState.paketLabel}</div>` : ""}
      <div class="big-score">${gState.score}</div>
      <div class="sub">poin &middot; ${gState.correctCount}/${total} benar (${acc}%) ${gState.maxStreak>1 ? '&middot; 🔥 combo tertinggi x'+gState.maxStreak : ''}</div>
      <div class="sub" style="color:var(--gold);font-weight:700;">✨ +${earnedXP} XP &middot; 🪙 +${earnedCoins} koin</div>
      ${achvHtml}
      ${justUnlocked
        ? `<div style="margin-top:10px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(157,0,255,.18));border:1px solid var(--cyan);font-weight:800;">🔓 Level berikutnya terbuka! Lanjut ke ${levelDisplayLabel(setupPacketIndex+1)}</div>`
        : (setupMode === "ujian" && acc < 80 ? `<div style="margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,42,122,.12);border:1px solid var(--sakura);font-weight:700;font-size:13px;">🔒 Minimal 80% untuk buka level berikutnya. Coba lagi ya!</div>` : "")}
      ${leaderboardHtml}
      <div class="export-row">
        <button id="copyBtn">📋 Salin Hasil</button>
        <button id="downloadBtn">🖼️ Unduh Kartu Hasil</button>
      </div>
      ${gState.misses.length ? `
        <div style="text-align:left;font-weight:700;font-size:13px;margin-bottom:8px;">Perlu diulang:</div>
        <div class="miss-list">
          ${gState.misses.map(m=>`<div class="miss-item"><div class="mi-pattern">${m.jp}</div><div class="mi-meaning">${m.meaning}</div></div>`).join("")}
        </div>
      ` : `<div class="no-miss">🏆 Sempurna! Semua benar.</div>`}
      <button class="play-btn" id="againBtn" style="margin-top:10px;">↻ Main Lagi</button>
    </div>

  if(achievements.length) setTimeout(()=> spawnConfetti(window.innerWidth/2, 120, 40), 200);

  $("copyBtn").addEventListener("click", ()=>{
    const text = `HASIL PENILAIAN ${materiLabel.toUpperCase()}${gState.paketLabel ? ' ('+gState.paketLabel+')' : ''}\nNama: ${student.nama}\nNIS: ${student.nis}\nKelas: ${student.kelas||"-"}\nSkor: ${gState.score} poin\nBenar: ${gState.correctCount}/${total} (${acc}%)\nNilai: ${grade.letter}`;
    navigator.clipboard.writeText(text).then(()=>{
      $("copyBtn").textContent = "✓ Tersalin";
      setTimeout(()=> $("copyBtn").textContent = "📋 Salin Hasil", 1500);
    });
  });

  $("downloadBtn").addEventListener("click", ()=> downloadResultCard(grade, acc, total, dateStr));

  $("againBtn").addEventListener("click", ()=>{ playSFX('click'); renderStart(); });
}

/* Peta warna nilai huruf -> hex asli (BUKAN var(--xxx)) khusus untuk dipakai
   di dalam <canvas>, karena canvas 2D context tidak bisa membaca CSS custom
   property seperti "var(--mint)" — kalau dipaksa, warnanya gagal tergambar. */
function gradeColorHex(letter){
  switch(letter){
    case "A": return "#00F0B5";
    case "B": return "#00E5FF";
    case "C": return "#FFD700";
    case "D": return "#FFD700";
    default:  return "#FF3366";
  }
}

/* Menggambar kartu hasil sebagai PNG memakai <canvas> (murni JS, tanpa
   library luar) supaya tetap berfungsi offline. Gaya "dark card" dengan efek
   glow. FUNGSI INI GENERIK — menerima satu object data polos "opts" saja
   (bukan gState/setupType langsung), supaya bisa dipakai baik:
   1) tepat setelah kuis selesai (data diambil dari gState yg masih hidup), maupun
   2) dari daftar Riwayat Saya (data diambil dari record localStorage lama).
   opts = { materiLabel, paketLabel, studentName, studentNis, studentKelas,
            dateStr, gradeLetter, score, correctCount, total, acc, filenameBase } */
function renderResultCardToImage(opts){
  const W = 900, H = 620;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const gradeColor = gradeColorHex(opts.gradeLetter);

  // ===== latar belakang gelap dengan gradasi dasar =====
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, "#0d0b1e");
  bg.addColorStop(0.5, "#140f2e");
  bg.addColorStop(1, "#0a1420");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // ===== dua "glow" radial dekoratif di pojok (magenta kiri-atas, cyan kanan-bawah) =====
  const glow1 = ctx.createRadialGradient(60,40,0, 60,40,340);
  glow1.addColorStop(0, "rgba(217,70,239,0.28)");
  glow1.addColorStop(1, "rgba(217,70,239,0)");
  ctx.fillStyle = glow1;
  ctx.fillRect(0,0,W,H);

  const glow2 = ctx.createRadialGradient(W-60,H-40,0, W-60,H-40,380);
  glow2.addColorStop(0, "rgba(34,211,238,0.22)");
  glow2.addColorStop(1, "rgba(34,211,238,0)");
  ctx.fillStyle = glow2;
  ctx.fillRect(0,0,W,H);

  const pad = 42;

  // ===== header: ikon + judul =====
  ctx.textAlign = "left";
  ctx.font = "34px sans-serif";
  ctx.fillText("🎮", pad, pad+34);
  ctx.fillStyle = "#22d3ee";
  ctx.font = "bold 30px sans-serif";
  ctx.fillText("NAFIS SENSEI ゲームコーナー", pad+46, pad+30);

  // sub-judul: jenis materi + paket soal (jika ada)
  const subLabel = "HASIL PENILAIAN — " + opts.materiLabel.toUpperCase() + (opts.paketLabel && opts.paketLabel !== '-' ? "  ·  " + opts.paketLabel.toUpperCase() : "");
  ctx.fillStyle = "#9ca3af";
  ctx.font = "bold 15px sans-serif";
  ctx.fillText(subLabel, pad+2, pad+62);

  // garis pemisah tipis
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, pad+82); ctx.lineTo(W-pad, pad+82); ctx.stroke();

  // ===== identitas siswa (kiri) =====
  const infoY = pad+150;
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 40px sans-serif";
  ctx.fillText(opts.studentName || "-", pad, infoY);

  ctx.fillStyle = "#9ca3af";
  ctx.font = "20px sans-serif";
  const kelasBagian = opts.studentKelas ? ("NIS "+opts.studentNis+"  ·  "+opts.studentKelas) : ("NIS "+(opts.studentNis||"-"));
  ctx.fillText(kelasBagian, pad+2, infoY+34);
  ctx.fillText(opts.dateStr, pad+2, infoY+62);

  // ===== lingkaran nilai huruf dengan efek glow (kanan atas) =====
  const circleX = W-pad-90, circleY = pad+70, circleR = 66;
  ctx.save();
  ctx.shadowColor = gradeColor;
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR, 0, Math.PI*2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = gradeColor;
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.03)";
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR-6, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 56px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(opts.gradeLetter, circleX, circleY+20);
  ctx.textAlign = "left";

  // ===== kotak info skor (bawah) =====
  const boxY = infoY + 90;
  const boxH = 130;
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  roundRect(ctx, pad, boxY, W-pad*2, boxH, 18);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.10)";
  ctx.lineWidth = 1;
  roundRect(ctx, pad, boxY, W-pad*2, boxH, 18);
  ctx.stroke();

  // skor besar kuning, di kiri kotak
  ctx.fillStyle = "#facc15";
  ctx.font = "bold 56px sans-serif";
  ctx.fillText(`${opts.score}`, pad+34, boxY+72);
  ctx.fillStyle = "#9ca3af";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("POIN", pad+36, boxY+98);

  // garis pemisah vertikal di dalam kotak
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.beginPath();
  ctx.moveTo(pad+280, boxY+20); ctx.lineTo(pad+280, boxY+boxH-20); ctx.stroke();

  // benar & akurasi, di kanan kotak
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 26px sans-serif";
  ctx.fillText(`${opts.correctCount} / ${opts.total} benar`, pad+320, boxY+58);
  ctx.fillStyle = "#9ca3af";
  ctx.font = "18px sans-serif";
  ctx.fillText(`Akurasi ${opts.acc}%`, pad+320, boxY+92);

  // ===== footer =====
  ctx.textAlign = "center";
  ctx.font = "italic 15px sans-serif";
  ctx.fillStyle = "#6b7280";
  ctx.fillText("Dibuat otomatis oleh Nafis Sensei ゲームコーナー — mohon kirim gambar ini ke gurumu.", W/2, H-pad+2);

  const link = document.createElement("a");
  const safeName = (opts.studentName||"hasil").replace(/[^a-zA-Z0-9]+/g,"_");
  link.download = `${opts.filenameBase || ('hasil_'+safeName+'_'+(opts.studentNis||''))}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

/* Dipanggil dari tombol "Unduh Kartu Hasil" tepat setelah kuis selesai —
   data diambil dari gState/setupType yang masih "hidup" di sesi ini. */
function downloadResultCard(grade, acc, total, dateStr){
  const materiLabel = setupType === "bunpo" ? "Pola Kalimat" : (setupType === "dokkai" ? "Dokkai (Bacaan)" : (setupType === "jlpttest" ? "Tes Kosakata (JLPT)" : "Kosakata & Kanji"));
  renderResultCardToImage({
    materiLabel,
    paketLabel: gState.paketLabel || "-",
    studentName: student.nama,
    studentNis: student.nis,
    studentKelas: student.kelas,
    dateStr,
    gradeLetter: grade.letter,
    score: gState.score,
    correctCount: gState.correctCount,
    total,
    acc
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* Papan skor lokal, terpisah per kombinasi cakupan+jenis+jumlah soal
   (biar adil, bukan campur level N5 gampang vs N2 susah). Top 10
   disimpan per kombinasi di localStorage. */
function leaderboardKey(){
  return `nafis_leaderboard_${setupScope}_${setupType}_${setupCount}`;
}
function saveToLeaderboard(record){
  const key = leaderboardKey();
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(key) || "[]"); }catch(e){}
  list.push(record);
  list.sort((a,b)=> b.score - a.score);
  list = list.slice(0,10);
  localStorage.setItem(key, JSON.stringify(list));
  return list;
}

function saveHistoryToLocal(record) {
  let list = [];
  const saved = localStorage.getItem("nafis_history");
  if(saved) list = JSON.parse(saved);
  list.unshift(record);
  if(list.length > 20) list.pop();
  localStorage.setItem("nafis_history", JSON.stringify(list));
}

function renderHistory() {
  const listEl = $("historyList");
  const saved = localStorage.getItem("nafis_history");
  if (!saved || JSON.parse(saved).length === 0) {
    listEl.innerHTML = `<div style="text-align:center;color:var(--sub);padding:20px;">Belum ada riwayat kuis yang dimainkan.</div>`;
    return;
  }
  const list = JSON.parse(saved);
  listEl.innerHTML = list.map((h,idx) => `
    <div class="history-item">
      <div class="hi-row">
        <div class="hi-main">
          <div class="hi-title">[${h.jenis}${h.paket && h.paket!=='-' ? ' · '+h.paket : ''}] ⭐ Skor: ${h.skor} (${h.benar}/${h.total} Benar - ${h.akurasi}%) - Nilai: ${h.nilai}</div>
          <div class="hi-sub">🕒 ${h.tanggal}</div>
        </div>
        <button class="hi-download-btn" data-idx="${idx}" title="Unduh kartu hasil ini sebagai gambar">🖼️</button>
      </div>
    </div>
  `).join("");

  document.querySelectorAll(".hi-download-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      downloadHistoryItemCard(list[idx]);
    });
  });
}

/* Unduh SATU riwayat kuis tertentu (bukan digabung) sebagai gambar PNG,
   memakai desain kartu hasil yang sama seperti yang muncul tepat setelah
   kuis selesai. Datanya diambil dari record riwayat yang tersimpan (bukan
   gState yang sudah tidak "hidup" lagi), digabung dengan identitas siswa
   yang sedang login saat ini. */
function downloadHistoryItemCard(record){
  const safeDate = (record.tanggal||"").replace(/[^0-9a-zA-Z]+/g,"_");
  renderResultCardToImage({
    materiLabel: record.jenis,
    paketLabel: record.paket || "-",
    studentName: student ? student.nama : "-",
    studentNis: student ? student.nis : "",
    studentKelas: student ? student.kelas : "",
    dateStr: record.tanggal,
    gradeLetter: record.nilai,
    score: record.skor,
    correctCount: record.benar,
    total: record.total,
    acc: record.akurasi,
    filenameBase: `riwayat_${(student&&student.nama||"hasil").replace(/[^a-zA-Z0-9]+/g,"_")}_${safeDate}`
  });
}

/* Unduh seluruh riwayat kuis (tersimpan di perangkat ini) sebagai file CSV,
   supaya guru/siswa bisa membuka di Excel atau melampirkannya sebagai bukti. */
function downloadHistoryCSV(){
  const saved = localStorage.getItem("nafis_history");
  const list = saved ? JSON.parse(saved) : [];
  if(!list.length){ alert("Belum ada riwayat untuk diunduh."); return; }
  const header = ["Tanggal","Nama","NIS","Kelas","Jenis","Level","Skor","Benar","Total","Akurasi(%)","Nilai"];
  const rows = list.map(h => [
    h.tanggal, student ? student.nama : "", student ? student.nis : "", student ? (student.kelas||"") : "",
    h.jenis, h.paket || "-", h.skor, h.benar, h.total, h.akurasi, h.nilai
  ]);
  const csvEsc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [header, ...rows].map(r => r.map(csvEsc).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  const safeName = (student && student.nama ? student.nama : "riwayat").replace(/[^a-zA-Z0-9]+/g,"_");
  link.href = url;
  link.download = `riwayat_${safeName}.csv`;
  link.click();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
$("downloadHistoryBtn").addEventListener("click", downloadHistoryCSV);
</script>
