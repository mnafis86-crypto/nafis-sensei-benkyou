<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nafis Sensei ゲームコーナー — Penilaian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
   :root {
    --bg: #0A0A14; 
    --panel: rgba(22, 22, 34, 0.75); 
    --panel2: rgba(32, 32, 54, 0.9);
    --ink: #E2E8F0; 
    --sub: #94A3B8; 
    --line: rgba(0, 229, 255, 0.25);
    --sakura: #FF2A7A;
    --sakura-dk: #D9005A;
    --cyan: #00E5FF;
    --mint: #00F0B5; 
    --gold: #FFD700; 
    --red: #FF3366;
    --n5: #00E5FF; 
    --n4: #FFD700;
    --n3: #FF9F5B;
    --n2: #FF2A7A;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; min-height: 100vh; 
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 42, 122, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0, 229, 255, 0.15) 0%, transparent 45%),
      var(--bg);
    background-image: url('data:image/svg+xml;utf8,<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><text x="15" y="45" font-size="20" fill="rgba(255,255,255,0.015)" font-family="sans-serif">語彙</text></svg>'),
                      radial-gradient(circle at 15% 10%, rgba(255, 42, 122, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0, 229, 255, 0.15) 0%, transparent 45%), var(--bg);
    color: var(--ink); 
    font-family: "Inter", "Noto Sans JP", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .wrap { 
    width: 100%; 
    max-width: 520px; 
    margin: 0 auto; 
    padding: 16px 14px 50px; 
  }
  
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .brand { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: center; background: var(--panel); padding: 14px; border-radius: 16px; border: 1px solid var(--line); backdrop-filter: blur(10px); }
  .brand h1 { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 20px; margin: 0; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); color: var(--cyan); }
  .brand span { color: var(--sub); font-size: 11.5px; letter-spacing: 0.3px; }
  .brand .stats { font-size: 10.5px; color: var(--mint); margin-top: 2px; }
  
  .whoami { font-size: 12px; color: var(--sub); background: var(--panel2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; display: none; width: 100%; text-align: center; margin-bottom: 12px; backdrop-filter: blur(10px); }
  .whoami b { color: var(--cyan); }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .tab-btn.active { background: rgba(0, 229, 255, 0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2) inset; }

  .panel { display: none; animation: fadeIn 0.3s ease; } 
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ============================================================
     LANDING — Ruang Arcade Kabinet Neon
     ============================================================ */
  #landing {
    position: fixed; inset: 0; z-index: 999;
    background:
      radial-gradient(ellipse 70% 45% at 50% 8%, rgba(157,0,255,0.22), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 96%, rgba(0,229,255,0.14), transparent 60%),
      linear-gradient(180deg, #05050c 0%, #0a0a16 55%, #050508 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: opacity .5s ease, visibility .5s ease;
  }
  #landing.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .arcade-stage {
    width: 100%; max-width: 460px; padding: 26px 18px 30px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    position: relative;
  }

  /* neon kana scattered on the walls */
  .neon-kana { position: absolute; font-family: "Noto Sans JP", sans-serif; font-weight: 900;
    opacity: 0.85; pointer-events: none; user-select: none; animation: flicker 3.6s infinite ease-in-out; }
  .neon-kana.cy  { color: var(--cyan);  text-shadow: 0 0 6px var(--cyan),  0 0 18px var(--cyan),  0 0 34px rgba(0,229,255,.6); }
  .neon-kana.mg  { color: #ff2ad4;      text-shadow: 0 0 6px #ff2ad4,      0 0 18px #ff2ad4,      0 0 34px rgba(255,42,212,.6); }
  .neon-kana.pu  { color: #b06bff;      text-shadow: 0 0 6px #b06bff,      0 0 18px #b06bff,      0 0 34px rgba(176,107,255,.6); }
  .k1 { top: 4px;   left: 4px;   font-size: 26px; transform: rotate(-8deg); animation-delay: .2s; }
  .k2 { top: 2px;   right: 8px;  font-size: 30px; transform: rotate(6deg);  animation-delay: 1.1s; }
  .k3 { top: 58px;  left: -6px;  font-size: 20px; transform: rotate(4deg); animation-delay: .6s; }
  .k4 { top: 60px;  right: -4px; font-size: 22px; transform: rotate(-5deg); animation-delay: 1.8s; }
  .k5 { bottom: 74px; left: 0px; font-size: 18px; transform: rotate(-4deg); animation-delay: 2.4s; }
  .k6 { bottom: 70px; right: 2px; font-size: 20px; transform: rotate(7deg); animation-delay: .9s; }
  @keyframes flicker {
    0%, 19%, 21%, 23%, 54%, 56%, 100% { opacity: 0.85; }
    20%, 22%, 55% { opacity: 0.35; }
  }

  .arcade-title { text-align: center; margin-top: 2px; }
  .landing-logo {
    width: 92px; height: 92px; border-radius: 50%; object-fit: cover;
    box-shadow: 0 0 18px rgba(0,229,255,.6), 0 0 36px rgba(157,0,255,.4);
    margin-bottom: 8px; animation: pulseGlow 2.2s infinite ease-in-out;
  }
  .arcade-title .jp {
    font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 21px; letter-spacing: .5px;
    color: #fff; text-shadow: 0 0 8px rgba(0,229,255,.7), 0 0 22px rgba(0,229,255,.4);
  }
  .arcade-title .welcome {
    font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 15px; margin-top: 2px;
    color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,.8);
  }

  /* ============================================================
     MESIN ARCADE — versi detail (marquee+logo, speaker, dual
     joystick, panel samping bertulisan, neon tube kanan-kiri)
     ============================================================ */
  .arcade-scene { position: relative; display: flex; align-items: center; justify-content: center;
    gap: 6px; margin: 14px 0 6px; }
  .neon-tube { width: 4px; height: 210px; border-radius: 4px; flex-shrink: 0; }
  .neon-tube.left  { background: var(--cyan); box-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan), 0 0 36px rgba(0,229,255,.6); animation: tubeFlicker 3.2s infinite ease-in-out; }
  .neon-tube.right { background: #ff2ad4;    box-shadow: 0 0 8px #ff2ad4, 0 0 20px #ff2ad4, 0 0 36px rgba(255,42,212,.6); animation: tubeFlicker 3.2s infinite ease-in-out .5s; }
  @keyframes tubeFlicker { 0%,88%,100% { opacity:1; } 90% { opacity:.4; } 93% { opacity:1; } }

  .cabinet-wrap { position: relative; width: 232px; flex-shrink: 0; }

  /* bodi utama dgn "panel samping" trapesium memakai clip-path,
     memberi kesan perspektif 3D tanpa gambar raster — polos elegan,
     tanpa tulisan berulang, cukup aksen garis highlight tipis */
  .cab-side { position: absolute; top: 34px; bottom: 0; width: 16px;
    background: linear-gradient(180deg,#1f1d2c,#0a0913 85%);
    border: 1px solid rgba(0,229,255,.15);
  }
  .cab-side.l { left: -14px; clip-path: polygon(40% 0, 100% 0, 100% 100%, 0 100%); }
  .cab-side.r { right: -14px; clip-path: polygon(0 0, 60% 0, 100% 100%, 0 100%); }

  /* marquee polos bercahaya, cukup tulisan generik "ARCADE" —
     identitas brand cukup sekali di judul atas, tidak diulang di sini */
  .marquee {
    height: 40px; border-radius: 12px 12px 4px 4px;
    background: linear-gradient(135deg, #ff2ad4, #7b2aff);
    box-shadow: 0 0 18px rgba(255,42,212,.55), 0 0 34px rgba(123,42,255,.35);
    display: flex; align-items: center; justify-content: center;
    animation: pulseGlow 2.2s infinite ease-in-out;
  }
  .marquee .mq-text { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 13px; color: #fff;
    letter-spacing: 4px; }
  @keyframes pulseGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

  .cabinet-body {
    position: relative;
    background: linear-gradient(160deg, #1b1b28, #0c0c14 70%);
    border: 1px solid rgba(0,229,255,.25);
    border-top: none; border-radius: 0 0 12px 12px;
    padding: 10px 10px 12px; box-shadow: 0 0 26px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
  /* rivet/sekrup di sudut bodi, detail khas mesin dingdong asli */
  .rivet { position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5a5670, #201e2c);
    box-shadow: 0 0 3px rgba(0,0,0,.6), inset 0 0 1px rgba(255,255,255,.4); }
  .rivet.tl { top: 6px; left: 6px; } .rivet.tr { top: 6px; right: 6px; }
  .rivet.bl { bottom: 6px; left: 6px; } .rivet.br { bottom: 6px; right: 6px; }

  /* sepasang speaker bulat bermotif mesh */
  .speaker-row { display: flex; justify-content: center; gap: 18px; margin-bottom: 8px; }
  .speaker {
    width: 30px; height: 30px; border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center, rgba(0,229,255,.35) 0px, rgba(0,229,255,.35) 1px, transparent 1px, transparent 4px),
      radial-gradient(circle at 40% 35%, #23212f, #0a0913 75%);
    border: 1px solid rgba(0,229,255,.3);
    box-shadow: inset 0 0 8px rgba(0,0,0,.7), 0 0 6px rgba(0,229,255,.25);
  }

  .cab-screen {
    background: radial-gradient(circle at 50% 40%, #101425, #05060c 78%);
    border: 2px solid rgba(0,229,255,.35);
    border-radius: 6px; padding: 18px 8px; position: relative; overflow: hidden;
    box-shadow: inset 0 0 22px rgba(0,229,255,.15), 0 0 24px rgba(157,0,255,.25);
  }
  .cab-screen::before { /* CRT scanlines */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay; pointer-events: none;
  }
  .cab-screen .kanji {
    position: relative; text-align: center; font-family: "Noto Sans JP", sans-serif; font-weight: 900;
    font-size: 32px; letter-spacing: 2px;
    background: linear-gradient(180deg, #7CFBFF 0%, #00E5FF 45%, #b06bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(0 0 10px rgba(0,229,255,.85)) drop-shadow(0 0 22px rgba(157,0,255,.6));
    animation: screenFlicker 4.5s infinite ease-in-out;
  }
  @keyframes screenFlicker {
    0%, 92%, 100% { opacity: 1; } 93% { opacity: .55; } 95% { opacity: 1; } 96% { opacity: .7; }
  }

  /* panel kontrol: dua cluster joystick+tombol (kiri cyan, kanan magenta)
     + slot koin di tengah, label P1/P2 kecil — detail khas mesin dingdong */
  .control-panel { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 12px; padding: 6px 4px 0; }
  .coin-slot { width: 14px; height: 4px; border-radius: 2px; margin-top: 8px;
    background: #05060c; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 4px rgba(0,229,255,.3); }
  .player-lbl { display: block; text-align: center; font-size: 7px; font-weight: 900; letter-spacing: 1px; margin-top: 5px; }
  .player-lbl.cy { color: var(--cyan); text-shadow: 0 0 4px rgba(0,229,255,.6); }
  .player-lbl.mg { color: #ff2ad4; text-shadow: 0 0 4px rgba(255,42,212,.6); }
  .stick-cluster { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .joystick-ball { width: 20px; height: 20px; border-radius: 50%; position: relative; }
  .joystick-ball::before { content:""; position:absolute; left:50%; bottom:-9px; width:5px; height:12px;
    background: linear-gradient(180deg,#4a4658,#221f2e); border-radius: 2px; transform: translateX(-50%); z-index: -1; }
  .joystick-ball.cy { background: radial-gradient(circle at 35% 30%, #7CFBFF, var(--cyan)); box-shadow: 0 0 10px rgba(0,229,255,.7); }
  .joystick-ball.mg { background: radial-gradient(circle at 35% 30%, #ff8ae0, #ff2ad4); box-shadow: 0 0 10px rgba(255,42,212,.7); }
  .btn-arc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .btn-dot { width: 9px; height: 9px; border-radius: 50%; }
  .btn-dot.cy { background: radial-gradient(circle at 35% 30%, #8CFFEA, var(--mint)); box-shadow: 0 0 5px rgba(0,240,181,.6); }
  .btn-dot.mg { background: radial-gradient(circle at 35% 30%, #ffd27a, var(--gold)); box-shadow: 0 0 5px rgba(255,193,7,.6); }

  /* reflection on the floor */
  .cab-reflection {
    width: 232px; margin-top: 2px; transform: scaleY(-1); opacity: .18;
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 70%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,.6), transparent 70%);
    filter: blur(0.5px); flex-shrink: 0;
  }

  .arcade-copy { text-align: center; margin-top: 16px; }
  .arcade-copy .id-line { font-size: 13px; color: var(--ink); font-weight: 600; }
  .arcade-copy .jp-line { font-size: 13px; color: var(--sub); margin-top: 3px; font-family: "Noto Sans JP", sans-serif; }

  .insert-coin {
    margin-top: 18px; width: 100%; max-width: 260px; padding: 15px;
    border-radius: 14px; border: 1px solid var(--cyan); cursor: pointer;
    background: linear-gradient(135deg, rgba(0,229,255,.18), rgba(123,42,255,.18));
    color: #fff; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 14px;
    letter-spacing: 1.5px; text-transform: uppercase;
    box-shadow: 0 0 18px rgba(0,229,255,.35);
    animation: blinkBtn 1.6s infinite;
  }
  @keyframes blinkBtn {
    0%, 100% { box-shadow: 0 0 10px rgba(0,229,255,.25); }
    50% { box-shadow: 0 0 26px rgba(0,229,255,.65); }
  }
  .music-picker { margin-top: 16px; text-align: center; }
  .music-picker .mp-label { font-size: 10px; font-weight: 800; color: var(--sub); letter-spacing: 1px; margin-bottom: 7px; }
  .music-picker .mp-row { display: flex; gap: 8px; justify-content: center; }
  .music-picker .mp-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.04);
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .music-picker .mp-btn:active { transform: scale(0.88); }
  .music-picker .mp-btn.active { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.6); background: rgba(0,229,255,.12); }
  .music-picker .mp-name { font-size: 9.5px; color: var(--sub); font-weight: 700; margin-top: 6px; min-height: 12px; }
  .floor-glow {
    position: absolute; bottom: 0; left: 0; right: 0; height: 90px;
    background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(0,229,255,.18), transparent 70%);
    pointer-events: none;
  }

  .card { 
    background: var(--panel); 
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08); 
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; 
    padding: 20px 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  ruby { ruby-position: over; }
  rt { font-size: 0.55em; color: var(--cyan); font-weight: normal; }

  /* LOGIN */
  .login-wrap { max-width: 100%; margin: 10px auto; text-align: center; }
  .login-wrap h2 { font-family: "Noto Sans JP", sans-serif; font-size: 22px; margin: 0 0 6px; color: var(--ink); }
  .login-wrap p { color: var(--sub); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--cyan); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.4); color: var(--ink); font-family: inherit; font-size: 14px; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--sakura); box-shadow: 0 0 10px rgba(255, 42, 122, 0.3); }
  
  .login-btn { width: 100%; margin-top: 6px; padding: 15px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--sakura), var(--sakura-dk)); color: #fff; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 42, 122, 0.4); min-height: 50px; }

  /* STUDY & FLASHCARD */
  .flash { border-radius: 16px; padding: 30px 18px; text-align: center; position: relative; background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.1), transparent), rgba(0,0,0,0.3); border: 1px solid var(--line); min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .flash .lvl { position: absolute; top: 12px; left: 14px; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid; }
  .flash .lvl.n5 { background: rgba(0, 229, 255, 0.1); color: var(--n5); border-color: var(--n5); }
  .flash .lvl.n4 { background: rgba(255, 215, 0, 0.1); color: var(--n4); border-color: var(--n4); }
  .flash .lvl.n3 { background: rgba(255, 159, 91, 0.1); color: var(--n3); border-color: var(--n3); }
  .flash .lvl.n2 { background: rgba(255, 42, 122, 0.1); color: var(--n2); border-color: var(--n2); }
  .flash .src { position: absolute; top: 12px; right: 14px; font-size: 10.5px; color: var(--sub); background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 6px; }
  
  .flash .pattern { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 24px; line-height: 1.4; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.3); }
  .flash .meaning { color: var(--cyan); font-size: 14px; font-weight: 600; }
  .flash .romaji-line { color: var(--sub); font-size: 12.5px; font-style: italic; }
  .flash .detail-box { color: var(--ink); font-size: 12.5px; line-height: 1.6; text-align: left; background: rgba(0, 229, 255, 0.05); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 4px; }
  .flash .example-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--sakura); border-radius: 8px; padding: 12px 14px; text-align: left; margin-top: 8px; }
  .flash .example-jp { font-family: "Noto Sans JP", sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fff; line-height: 1.5; }
  .flash .example-id { color: var(--sub); font-size: 13px; font-style: italic; }
  
  .flash.kotoba-mode .pattern { font-size: 32px; color: var(--mint); letter-spacing: 1px; }
  .flash .type-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,0.06); color:var(--sub); margin-top:4px; letter-spacing:0.5px; }
  
  .study-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; }
  .navbtn { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--ink); font-weight: 600; font-size: 12.5px; cursor: pointer; min-height: 42px; }
  .navbtn:disabled { opacity: .3; cursor: not-allowed; }
  .progress-text { color: var(--cyan); font-size: 11.5px; font-family: monospace; white-space: nowrap; }

  /* GAME SETUP / PLAY */
  .start-screen { text-align: center; padding: 4px; }
  .start-screen h2 { font-family: "Noto Sans JP", sans-serif; font-size: 22px; margin: 0 0 8px; color: #fff; }
  .start-screen p { color: var(--sub); font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
  
  .setup-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 22px; }
  .setup-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; text-align: left; }
  .setup-box .lbl { font-size: 11px; color: var(--cyan); font-weight: 700; margin-bottom: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
  .setup-box .lbl .cnt { color: var(--sub); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .opt-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt-row button { flex: 1; min-width: calc(20% - 6px); padding: 9px 4px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--sub); font-size: 12px; font-weight: 600; cursor: pointer; min-height: 38px; }
  .opt-row button.active { background: var(--sakura); border-color: var(--sakura); color: #fff; box-shadow: 0 0 8px rgba(255, 42, 122, 0.4); }
  .opt-row button:disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.6); }

  /* ============================================================
     PETA LEVEL — jalur bergelombang ala game (Level Berjenjang)
     menggantikan grid tombol polos.
     ============================================================ */
  .level-map { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; max-height: 360px; overflow-y: auto; }
  .level-node-row { display: flex; align-items: center; width: 100%; position: relative; min-height: 62px; }
  .level-node-row.pos-l { justify-content: flex-start; padding-left: 16%; }
  .level-node-row.pos-r { justify-content: flex-end; padding-right: 16%; }
  .level-node-row.pos-c { justify-content: center; }
  .level-connector { position: absolute; left: 50%; top: -18px; width: 3px; height: 18px; background: var(--line); transform: translateX(-50%); z-index: 1; }
  .level-connector.done { background: var(--mint); box-shadow: 0 0 6px rgba(0,240,181,.5); }
  .level-node {
    width: 50px; height: 50px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; cursor: pointer; position: relative; z-index: 2; border: 3px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--sub); flex-shrink: 0; transition: transform .15s ease;
  }
  .level-node:active:not(.locked) { transform: scale(0.9); }
  .level-node.unlocked { background: linear-gradient(135deg, var(--cyan), #7b2aff); border-color: rgba(255,255,255,.35); color: #fff; box-shadow: 0 0 12px rgba(0,229,255,.45); cursor: pointer; }
  .level-node.cleared { background: linear-gradient(135deg, var(--mint), #049a77); border-color: rgba(255,255,255,.35); color: #fff; }
  .level-node.active-pick { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,215,0,.75); animation: nodePulse 1.5s infinite ease-in-out; }
  .level-node.locked { cursor: not-allowed; }
  .level-node .ln-sub { font-size: 8px; font-weight: 700; margin-top: -2px; letter-spacing: .3px; }
  .level-node .ln-star { position: absolute; top: -9px; font-size: 13px; filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
  @keyframes nodePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .level-node.boss-node { width: 58px; height: 58px; border-color: var(--sakura); }
  .level-node.boss-node.unlocked, .level-node.boss-node.active-pick { background: linear-gradient(135deg, var(--sakura), #7b2aff); }
  
  .play-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--cyan), #0099FF); color: #000; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 1.2px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); min-height: 52px; }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; font-family: monospace; }

  /* ============================================================
     GAME JUICE — efek visual biar berasa "game sungguhan"
     ============================================================ */
  #gameArea { position: relative; }
  @keyframes shakeScreen {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-0.5deg); }
    40% { transform: translateX(7px) rotate(0.5deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
  }
  .shake-active { animation: shakeScreen 0.4s ease; }

  .opt.correct-pop { animation: correctPop 0.5s ease; }
  @keyframes correctPop {
    0% { transform: scale(1); }
    30% { transform: scale(1.06); box-shadow: 0 0 22px rgba(0,240,181,.8); }
    100% { transform: scale(1); }
  }
  .opt.wrong-pop { animation: wrongShake 0.4s ease; }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
  }

  /* confetti burst */
  .confetti-piece { position: fixed; top: 0; left: 0; width: 8px; height: 8px; pointer-events: none; z-index: 9998; border-radius: 2px; opacity: 1; }
  @keyframes confettiFall {
    0% { transform: translate(var(--tx0), var(--ty0)) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx1), var(--ty1)) rotate(var(--rot)) scale(0.4); opacity: 0; }
  }

  /* floating score popup (+15 dst) */
  .score-popup {
    position: fixed; z-index: 9999; font-weight: 900; font-size: 20px; color: var(--mint);
    text-shadow: 0 0 8px rgba(0,240,181,.7); pointer-events: none;
    animation: scorePopupFloat 0.9s ease-out forwards;
  }
  @keyframes scorePopupFloat {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    20% { transform: translateY(-6px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-46px) scale(1); opacity: 0; }
  }

  /* combo counter popup, muncul di tengah layar */
  .combo-popup {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(0.5);
    z-index: 9999; pointer-events: none; text-align: center;
    font-family: "Noto Sans JP", sans-serif; font-weight: 900;
    animation: comboPopIn 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .combo-popup .big { font-size: 34px; color: var(--gold); text-shadow: 0 0 16px rgba(255,193,7,.8), 0 0 30px rgba(255,42,122,.5); letter-spacing: 1px; }
  .combo-popup .small { font-size: 13px; color: #fff; margin-top: 2px; text-shadow: 0 0 6px rgba(0,0,0,.6); }
  @keyframes comboPopIn {
    0% { transform: translate(-50%,-50%) scale(0.3); opacity: 0; }
    15% { transform: translate(-50%,-50%) scale(1.25); opacity: 1; }
    30% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    80% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-58%) scale(0.9); opacity: 0; }
  }

  /* toast pemberitahuan power-up didapat / achievement */
  .game-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px);
    z-index: 9999; background: linear-gradient(135deg, rgba(0,229,255,.95), rgba(157,0,255,.95));
    color: #fff; font-weight: 800; font-size: 13px; padding: 10px 18px; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); opacity: 0; pointer-events: none;
    animation: toastPop 2.4s ease forwards;
  }
  @keyframes toastPop {
    0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    12% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  /* power-up bar */
  .powerup-bar { display: flex; gap: 8px; justify-content: center; margin: 4px 0 12px; }
  .pu-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    cursor: pointer; font-size: 18px; transition: transform .15s ease;
  }
  .pu-btn:active:not(:disabled) { transform: scale(0.9); }
  .pu-btn:disabled { opacity: .3; cursor: not-allowed; filter: grayscale(1); }
  .pu-btn .pu-count {
    position: absolute; top: -6px; right: -6px; background: var(--sakura); color: #fff;
    font-size: 10px; font-weight: 900; border-radius: 50%; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center; font-family: sans-serif;
  }
  .pu-btn .pu-label { font-size: 8px; font-weight: 700; color: var(--sub); letter-spacing: .3px; }
  .pu-btn.pu-glow { animation: puGlow 1.4s infinite ease-in-out; }
  @keyframes puGlow { 0%,100% { box-shadow: 0 0 0 rgba(0,229,255,0); } 50% { box-shadow: 0 0 14px rgba(0,229,255,.6); } }

  .opt.opt-eliminated { opacity: .25; pointer-events: none; text-decoration: line-through; }

  /* papan skor lokal */
  .leaderboard { text-align: left; margin: 14px 0; }
  .leaderboard .lb-title { font-weight: 800; font-size: 13px; margin-bottom: 6px; display:flex; align-items:center; gap:6px; }
  .lb-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; margin-bottom: 4px;
    background: rgba(255,255,255,.03); font-size: 12.5px; }
  .lb-row.me { background: rgba(0,229,255,.12); border: 1px solid var(--cyan); font-weight: 800; }
  .lb-row .lb-rank { width: 20px; text-align: center; font-weight: 900; }
  .lb-row .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .lb-score { font-weight: 800; color: var(--gold); }

  /* badge pencapaian */
  .achv-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .achv-badge {
    display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(255,193,7,.18), rgba(255,42,122,.18)); border: 1px solid var(--gold);
    font-size: 11.5px; font-weight: 800; animation: badgePop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes badgePop { 0% { transform: scale(0); opacity:0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity:1; } }

  /* ============================================================
     META-GAME — profil pemain (XP/level/koin), misi harian, toko
     tema, dan mode "Boss Battle" di soal terakhir tiap kuis.
     ============================================================ */
  .player-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 8px 14px 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: 12px;
  }
  .player-bar .pb-avatar-wrap { position: relative; flex-shrink: 0; width: 40px; height: 40px; cursor: pointer; }
  .player-bar .pb-avatar {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--cyan), #7b2aff); font-size: 20px;
    box-shadow: 0 0 10px rgba(0,229,255,.5); border: 2px solid rgba(255,255,255,.15);
  }
  .player-bar .pb-lvbadge {
    position: absolute; bottom: -3px; right: -3px; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px;
    background: var(--gold); color: #1a1a1a; font-size: 9.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }
  .player-bar .pb-mid { flex: 1; min-width: 0; }
  .player-bar .pb-title { font-weight: 800; font-size: 12px; color: var(--ink); }
  .player-bar .pb-xptrack { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); margin-top: 4px; overflow: hidden; }
  .player-bar .pb-xpfill { height: 100%; background: linear-gradient(90deg, var(--mint), var(--cyan)); border-radius: 4px; transition: width .5s ease; }
  .player-bar .pb-coins { flex-shrink: 0; font-weight: 800; color: var(--gold); display:flex; align-items:center; gap:3px; }
  .player-bar .pb-shopbtn {
    flex-shrink: 0; border: 1px solid var(--gold); background: rgba(255,215,0,.08); color: var(--gold);
    border-radius: 10px; padding: 5px 9px; font-size: 11px; font-weight: 800; cursor: pointer;
  }

  .xp-toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 9999;
    background: linear-gradient(135deg, rgba(255,215,0,.95), rgba(255,42,122,.9)); color: #1a1a1a;
    font-weight: 900; font-size: 13px; padding: 10px 18px; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: toastPop 2.6s ease forwards;
  }

  /* level up modal singkat */
  .levelup-banner {
    position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
    background: rgba(5,5,10,.75); animation: fadeIn .3s ease;
  }
  .levelup-card {
    text-align: center; padding: 30px 24px; border-radius: 20px;
    background: linear-gradient(160deg, #1b1b28, #0c0c14); border: 2px solid var(--gold);
    box-shadow: 0 0 40px rgba(255,215,0,.4); animation: badgePop .5s cubic-bezier(.34,1.56,.64,1);
  }
  .levelup-card .lu-lv { font-size: 44px; font-weight: 900; color: var(--gold); text-shadow: 0 0 18px rgba(255,215,0,.7); }
  .levelup-card .lu-title { font-size: 16px; font-weight: 800; color: #fff; margin-top: 4px; }
  .levelup-card button { margin-top: 18px; padding: 10px 26px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--cyan), #7b2aff); color: #fff; font-weight: 800; cursor: pointer; }

  /* misi harian */
  .missions-card { margin: 10px 14px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .missions-card .mc-title { font-weight: 800; font-size: 12.5px; margin-bottom: 8px; display:flex; align-items:center; gap:6px; }
  .mission-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
  .mission-row:last-child { margin-bottom: 0; }
  .mission-row .m-icon { flex-shrink: 0; font-size: 15px; }
  .mission-row .m-body { flex: 1; min-width: 0; }
  .mission-row .m-label { color: var(--ink); }
  .mission-row .m-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 3px; overflow: hidden; }
  .mission-row .m-fill { height: 100%; background: var(--mint); border-radius: 3px; }
  .mission-row.done .m-label { color: var(--mint); text-decoration: line-through; opacity: .75; }
  .mission-row .m-reward { flex-shrink: 0; font-size: 10.5px; font-weight: 800; color: var(--gold); }

  /* toko tema */
  .shop-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(5,5,10,.8); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shop-card { width: 100%; max-width: 440px; max-height: 80vh; overflow-y: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .shop-card h3 { margin: 0 0 4px; font-size: 16px; }
  .shop-card .shop-coins { color: var(--gold); font-weight: 800; font-size: 13px; margin-bottom: 12px; }
  .shop-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); margin-bottom: 8px; }
  .shop-item .si-swatch { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
  .shop-item .si-mid { flex: 1; }
  .shop-item .si-name { font-weight: 800; font-size: 13px; }
  .shop-item .si-price { font-size: 11px; color: var(--sub); }
  .shop-item button { flex-shrink: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(0,229,255,.1); color: var(--cyan); font-weight: 800; font-size: 11.5px; cursor: pointer; }
  .shop-item button:disabled { opacity: .4; cursor: not-allowed; }
  .shop-item button.owned { border-color: var(--mint); color: var(--mint); background: rgba(0,240,181,.1); }
  .shop-close { display: block; margin: 12px auto 0; padding: 8px 20px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--sub); cursor: pointer; }
  .shop-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .shop-tab { flex: 1; padding: 8px; text-align: center; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--sub); font-weight: 800; font-size: 12px; cursor: pointer; }
  .shop-tab.active { background: rgba(0,229,255,.15); color: var(--cyan); border-color: var(--cyan); }
  .shop-pane { display: none; }
  .shop-pane.active { display: block; }
  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .avatar-cell {
    position: relative; aspect-ratio: 1; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: rgba(255,255,255,.03); border: 2px solid var(--line); cursor: pointer;
  }
  .avatar-cell.equipped { border-color: var(--mint); box-shadow: 0 0 12px rgba(0,240,181,.5); }
  .avatar-cell.locked { opacity: .45; }
  .avatar-cell .ac-price { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    font-size: 8.5px; font-weight: 900; color: var(--gold); background: #0a0a14; padding: 0 4px; border-radius: 6px; white-space: nowrap; }
  .avatar-cell .ac-check { position: absolute; top: -5px; right: -5px; background: var(--mint); color: #06251d;
    width: 15px; height: 15px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .avatar-cell .ac-lock { position: absolute; top: -5px; right: -5px; font-size: 11px; }
  .avatar-name-preview { text-align: center; font-size: 11px; color: var(--sub); font-weight: 700; margin-bottom: 10px; min-height: 14px; }

  /* boss battle */
  .boss-intro {
    position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(255,42,122,.25), rgba(5,5,10,.92));
    animation: fadeIn .3s ease;
  }
  .boss-intro-card { text-align: center; padding: 10px; }
  .boss-intro-card .bi-icon { font-size: 60px; animation: bossShake 0.6s infinite; }
  @keyframes bossShake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .boss-intro-card .bi-title { font-size: 24px; font-weight: 900; color: var(--sakura); text-shadow: 0 0 16px rgba(255,42,122,.7); margin-top: 8px; letter-spacing: 1px; }
  .boss-intro-card .bi-sub { font-size: 13px; color: #fff; margin-top: 6px; opacity: .85; }
  .qcard.boss-card { border: 2px solid var(--sakura); box-shadow: 0 0 24px rgba(255,42,122,.35); position: relative; overflow: hidden; }
  .qcard.boss-card::before {
    content: "⚔️ SOAL BOS — POIN GANDA!"; display: block; text-align: center; font-weight: 900; font-size: 11px;

  }
  .hud .score { font-weight: 700; color: var(--cyan); font-size: 15px; }
  .hud .streak { color: var(--sakura); font-weight: 700; font-size: 13px; text-shadow: 0 0 6px rgba(255, 42, 122, 0.5); }

  /* avatar hidup di HUD saat main — bereaksi tiap jawaban */
  .quiz-avatar {
    position: absolute; top: -6px; right: 6px; width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), #7b2aff); display: flex; align-items: center; justify-content: center;
    font-size: 22px; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 0 10px rgba(0,229,255,.4); z-index: 5;
  }
  .quiz-avatar.reaction-happy { animation: avatarHappy 0.6s ease; }
  @keyframes avatarHappy { 0%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-10px) scale(1.15); } 60% { transform: translateY(2px) scale(0.95); } }
  .quiz-avatar.reaction-sad { animation: avatarSad 0.5s ease; filter: grayscale(.5); }
  @keyframes avatarSad { 0%,100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-5px) rotate(-8deg); } 75% { transform: translateX(5px) rotate(8deg); } }

  /* badge streak login harian pada avatar dashboard */
  .pb-streakbadge {
    position: absolute; top: -5px; left: -5px; background: linear-gradient(135deg,#ff6b1a,#ff2a7a); color: #fff;
    font-size: 9px; font-weight: 900; border-radius: 9px; padding: 1px 4px; display: flex; align-items: center; gap: 1px;
    border: 2px solid var(--bg);
  }

  /* ============================================================
     KOTODAMA CARD — sistem koleksi kartu. Tiap kata/pola/soal yang
     dijawab benar jadi kartu koleksi dengan rarity berdasar level
     (N5=Umum, N4=Jarang, N3=Langka, N2=Epik, Boss=Legendaris).
     Ini yang bikin belajar terasa seperti "membuka booster pack".
     ============================================================ */
  .rarity-N5 { --r1:#9aa5b1; --r2:#e2e8f0; --rname:"UMUM"; }
  .rarity-N4 { --r1:#00c07a; --r2:#7CFFDB; --rname:"JARANG"; }
  .rarity-N3 { --r1:#2f7bff; --r2:#8fc2ff; --rname:"LANGKA"; }
  .rarity-N2 { --r1:#a020f0; --r2:#e6a8ff; --rname:"EPIK"; }
  .rarity-legend { --r1:#ffb300; --r2:#fff3b0; --rname:"LEGENDARIS"; }

  .card-reveal-overlay { position: fixed; inset: 0; z-index: 10001; display: flex; align-items: center; justify-content: center;
    background: rgba(5,5,10,.85); animation: fadeIn .25s ease; }
  .kotodama-card {
    width: 190px; height: 260px; border-radius: 16px; position: relative; padding: 14px 12px;
    background: linear-gradient(160deg, #17151f, #0a0913);
    border: 3px solid var(--r1, var(--cyan)); box-shadow: 0 0 30px var(--r1, var(--cyan)), 0 10px 30px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    animation: cardFlipIn .55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes cardFlipIn { 0% { transform: rotateY(90deg) scale(0.7); opacity:0; } 100% { transform: rotateY(0) scale(1); opacity:1; } }
  .kotodama-card .kc-rarity { font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--r1); text-shadow: 0 0 6px var(--r1); }
  .kotodama-card .kc-level { position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 900; color: #fff;
    background: var(--r1); border-radius: 6px; padding: 2px 6px; }
  .kotodama-card .kc-jp { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 26px; text-align: center;
    background: linear-gradient(180deg, var(--r2), var(--r1)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px var(--r1)); line-height: 1.25; max-height: 100px; overflow: hidden; }
  .kotodama-card .kc-meaning { font-size: 11px; color: #dfe6ee; text-align: center; padding: 0 4px; }
  .kotodama-card .kc-badge { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--r1);
    display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,.04); }
  .kotodama-card .kc-new { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--sakura);
    color: #fff; font-size: 9px; font-weight: 900; padding: 3px 10px; border-radius: 10px; box-shadow: 0 0 10px rgba(255,42,122,.6); }
  .card-reveal-caption { text-align: center; margin-top: 16px; color: #fff; font-weight: 800; font-size: 13px; }
  .card-reveal-close { display: block; margin: 14px auto 0; padding: 8px 22px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--cyan), #7b2aff); color: #fff; font-weight: 800; cursor: pointer; }

  /* mini toast kartu duplikat (lebih ringan drpd overlay penuh) */
  .card-dupe-toast {
    position: fixed; right: 10px; bottom: 90px; z-index: 9999; display: flex; align-items: center; gap: 6px;
    background: rgba(20,20,32,.95); border: 1px solid var(--r1, var(--line)); border-radius: 12px; padding: 7px 11px;
    font-size: 11px; font-weight: 700; color: #fff; animation: toastPop 2s ease forwards;
  }

  /* album koleksi */
  .album-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(5,5,10,.85); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .album-card { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .album-card h3 { margin: 0 0 4px; font-size: 16px; }
  .album-progress { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .album-track { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 12px; }
  .album-track-fill { height: 100%; background: linear-gradient(90deg, var(--mint), var(--cyan)); }
  .album-tabs { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
  .album-tab { padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--sub); font-size: 11px; font-weight: 800; cursor: pointer; }
  .album-tab.active { background: rgba(0,229,255,.15); color: var(--cyan); border-color: var(--cyan); }
  .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mini-card { aspect-ratio: 3/4; border-radius: 10px; border: 2px solid var(--r1, var(--line)); background: linear-gradient(160deg, #17151f, #0a0913);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 3px; position: relative; }
  .mini-card .mc-jp { font-family:"Noto Sans JP",sans-serif; font-weight: 900; font-size: 15px; text-align: center;
    background: linear-gradient(180deg, var(--r2), var(--r1)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height:1.15; }
  .mini-card .mc-count { position: absolute; bottom: 3px; right: 4px; font-size: 8px; font-weight: 900; color: var(--sub); }
  .empty-slot { aspect-ratio: 3/4; border-radius: 10px; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--line); opacity: .5; }

  /* speech bubble sensei */
  .sensei-bubble {
    position: absolute; top: 34px; right: 4px; max-width: 160px; z-index: 6;
    background: #fff; color: #1a1a1a; font-size: 10.5px; font-weight: 700; padding: 7px 10px; border-radius: 12px 12px 12px 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35); animation: bubblePop 0.35s cubic-bezier(.34,1.56,.64,1), bubbleFade .35s ease 1.9s forwards;
  }
  @keyframes bubblePop { 0% { transform: scale(0.4) translateY(6px); opacity:0; } 100% { transform: scale(1) translateY(0); opacity:1; } }
  @keyframes bubbleFade { to { opacity: 0; transform: translateY(-6px); } }

  /* ============================================================
     OMIKUJI — undian keberuntungan harian ala kuil Jepang sungguhan.
     ============================================================ */
  .omikuji-card { margin: 10px 14px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .omikuji-card .om-icon { font-size: 26px; flex-shrink: 0; }
  .omikuji-card .om-mid { flex: 1; }
  .omikuji-card .om-title { font-weight: 800; font-size: 12.5px; }
  .omikuji-card .om-sub { font-size: 10.5px; color: var(--sub); margin-top: 1px; }
  .omikuji-card .om-cta { flex-shrink: 0; font-size: 10.5px; font-weight: 900; color: var(--gold); padding: 5px 10px;
    border: 1px solid var(--gold); border-radius: 8px; background: rgba(255,215,0,.08); }
  .omikuji-card.done { opacity: .55; cursor: default; }
  .omikuji-card.done .om-cta { color: var(--sub); border-color: var(--line); background: transparent; }

  .omikuji-overlay { position: fixed; inset: 0; z-index: 10001; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(255,42,122,.2), rgba(5,5,10,.92)); animation: fadeIn .3s ease; }
  .omikuji-box {
    width: 70px; height: 90px; margin: 0 auto 14px; background: linear-gradient(160deg, #3a1f0a, #1a0e04);
    border: 3px solid var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; cursor: pointer; box-shadow: 0 0 24px rgba(255,215,0,.5); animation: omikujiShake 1.8s infinite ease-in-out;
  }
  @keyframes omikujiShake { 0%,100% { transform: rotate(0); } 10% { transform: rotate(-4deg); } 20% { transform: rotate(4deg); } 30% { transform: rotate(0); } }
  .omikuji-slip {
    width: 220px; text-align: center; padding: 26px 18px; border-radius: 14px;
    background: linear-gradient(160deg, #fff8e6, #ffe9b0); color: #3a2400;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: slipDrop 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes slipDrop { 0% { transform: translateY(-40px) rotate(-6deg); opacity: 0; } 100% { transform: translateY(0) rotate(0); opacity: 1; } }
  .omikuji-slip .os-fortune { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 32px; margin-bottom: 6px; }
  .omikuji-slip .os-sub { font-size: 12px; font-weight: 700; opacity: .8; margin-bottom: 14px; }
  .omikuji-slip .os-reward { font-size: 13px; font-weight: 800; background: rgba(255,193,7,.25); border-radius: 10px; padding: 8px 12px; margin-bottom: 4px; }
  .omikuji-slip .os-msg { font-size: 11px; font-style: italic; opacity: .75; margin-top: 8px; line-height: 1.5; }
  .omikuji-close { display: block; margin: 16px auto 0; padding: 9px 24px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--cyan), #7b2aff); color: #fff; font-weight: 800; cursor: pointer; }

  /* fusi kartu (Kirakira / evolved) */
  .mini-card.evolved { border-width: 3px; box-shadow: 0 0 14px var(--r1, var(--gold)); animation: evolvedShine 2s infinite ease-in-out; }
  @keyframes evolvedShine { 0%,100% { box-shadow: 0 0 8px var(--r1,var(--gold)); } 50% { box-shadow: 0 0 18px var(--r1,var(--gold)); } }
  .mini-card .mc-fuse-btn {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 900;
    background: var(--sakura); color: #fff; border: none; border-radius: 8px; padding: 2px 6px; cursor: pointer; white-space: nowrap;
  }
  .mini-card .mc-sparkle { position: absolute; top: 2px; left: 2px; font-size: 10px; }
  .fusion-overlay { position: fixed; inset: 0; z-index: 10002; display: flex; align-items: center; justify-content: center;
    background: rgba(5,5,10,.9); animation: fadeIn .3s ease; }
  .fusion-result-card { text-align: center; }
  .fusion-result-card .fr-jp { font-family:"Noto Sans JP",sans-serif; font-weight:900; font-size:30px; color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,.8); animation: badgePop .5s cubic-bezier(.34,1.56,.64,1); }
  .fusion-result-card .fr-label { font-size: 13px; font-weight: 800; color: #fff; margin-top: 8px; }

  .timerbar-track { height: 5px; border-radius: 5px; background: rgba(0,0,0,0.5); overflow: hidden; margin-bottom: 18px; }
  .session-timer-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 6px 10px;
    background: rgba(255,42,122,.08); border: 1px solid var(--sakura); border-radius: 10px; }
  .session-timer-wrap .st-label { font-size: 11px; font-weight: 900; color: var(--sakura); flex-shrink: 0; }
  .session-timer-track { flex: 1; height: 8px; border-radius: 5px; background: rgba(0,0,0,.4); overflow: hidden; }
  .session-timer-fill { height: 100%; background: linear-gradient(90deg, var(--sakura), var(--gold)); transition: width .1s linear; }

  /* ============================================================
     MODE COCOK KARTU (MEMORY MATCH) — mini-game terpisah total dari
     alur kuis pilihan-ganda biasa: cari pasangan kata Jepang & arti
     Indonesia dengan membalik kartu, dikejar waktu.
     ============================================================ */
  .mem-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; font-weight: 800; }
  .mem-hud .mh-timer { color: var(--sakura); }
  .mem-hud .mh-moves { color: var(--sub); }
  .mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .mem-card {
    aspect-ratio: 3/4; border-radius: 12px; cursor: pointer; position: relative; perspective: 600px;
  }
  .mem-card-inner { position: relative; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
  .mem-card.flipped .mem-card-inner, .mem-card.matched .mem-card-inner { transform: rotateY(180deg); }
  .mem-face { position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; padding: 6px; text-align: center; }
  .mem-face.back {
    background: linear-gradient(160deg, #1b1b28, #0c0c14); border: 2px solid var(--line); font-size: 20px; color: var(--cyan);
  }
  .mem-face.front {
    background: linear-gradient(160deg, rgba(0,229,255,.15), rgba(157,0,255,.15)); border: 2px solid var(--cyan);
    transform: rotateY(180deg); font-weight: 800; font-size: 12px; color: #fff; word-break: break-word;
  }
  .mem-card.matched .mem-face.front { border-color: var(--mint); background: linear-gradient(160deg, rgba(0,240,181,.2), rgba(0,240,181,.08)); }
  .mem-card.jp-card .mem-face.front { font-family: "Noto Sans JP", sans-serif; font-size: 17px; }
  .mem-card.wrong-flash .mem-face.front { animation: memWrongFlash 0.4s ease; }
  @keyframes memWrongFlash { 0%,100% { border-color: var(--cyan); } 50% { border-color: var(--red); background: rgba(255,51,102,.2); } }

  /* ============================================================
     MODE DENGAR & TEBAK — pakai Web Speech API (TTS bawaan browser,
     gratis, tanpa file audio). Kata disembunyikan, siswa dengar lalu
     tebak artinya; teks & bacaan baru terungkap setelah menjawab.
     ============================================================ */
  .listen-box { text-align: center; padding: 22px 14px; margin-bottom: 16px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(0,229,255,.08), rgba(157,0,255,.08)); border: 1px solid var(--line); }
  .listen-speaker-btn {
    width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--cyan); background: rgba(0,229,255,.1);
    color: var(--cyan); font-size: 32px; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,.35);
  }
  .listen-speaker-btn.playing { animation: speakerPulse 0.6s infinite ease-in-out; }
  @keyframes speakerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); box-shadow: 0 0 32px rgba(0,229,255,.7); } }
  .listen-speaker-btn:disabled { opacity: .4; cursor: not-allowed; }
  .listen-hint { font-size: 11px; color: var(--sub); margin-top: 10px; font-weight: 700; }
  .listen-reveal { margin-top: 10px; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 22px; color: #fff; }
  .listen-reveal .lr-romaji { font-family: sans-serif; font-size: 12px; color: var(--sub); font-weight: 700; margin-top: 2px; }
  .voice-picker-link { display: block; text-align: center; font-size: 11px; font-weight: 800; color: var(--cyan);
    margin-top: -6px; margin-bottom: 12px; cursor: pointer; text-decoration: underline; }
  .voice-item { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px;
    background: rgba(255,255,255,.03); border: 1px solid var(--line); margin-bottom: 8px; }
  .voice-item.selected { border-color: var(--mint); background: rgba(0,240,181,.08); }
  .voice-item .vi-mid { flex: 1; min-width: 0; }
  .voice-item .vi-name { font-weight: 800; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .voice-item .vi-lang { font-size: 10px; color: var(--sub); }
  .voice-item .vi-test-btn { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--cyan);
    background: rgba(0,229,255,.1); color: var(--cyan); cursor: pointer; font-size: 15px; }
  .voice-item .vi-use-btn { flex-shrink: 0; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--mint);
    background: rgba(0,240,181,.1); color: var(--mint); font-weight: 800; font-size: 11px; cursor: pointer; }
  .voice-item .vi-use-btn.is-selected { background: var(--mint); color: #06251d; }
  .voice-empty-note { text-align: center; font-size: 12px; color: var(--sub); padding: 16px 10px; line-height: 1.6; }

  .timerbar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--mint)); width: 100%; transition: width .2s linear; }
  .timerbar-fill.danger { background: linear-gradient(90deg, var(--red), var(--sakura)); }

  .qcard { background: rgba(0,0,0,0.25); border-left: 3px solid var(--cyan); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .qcard .qtype { font-size: 11px; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .qcard .qnum { font-size: 11px; color: var(--sub); margin-bottom: 8px; font-family: monospace; letter-spacing: 0.5px; }
  .qcard .qtext { font-size: 16px; line-height: 1.5; color: #fff; }
  .qcard .qtext b { color: var(--cyan); }

  .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .opt { text-align: left; padding: 15px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--ink); cursor: pointer; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; min-height: 54px; display: flex; align-items: center; }
  .opt.correct { background: rgba(0, 240, 181, 0.15); border-color: var(--mint); color: var(--mint); }
  .opt.wrong { background: rgba(255, 51, 102, 0.15); border-color: var(--red); color: var(--red); }

  /* MENYUSUN KALIMAT (bunpo) */
  .assembly-area { min-height: 60px; background: rgba(0,0,0,0.25); border: 1px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .assembly-placeholder { color: var(--sub); font-size: 13px; font-style: italic; }
  .chunk-area { display: flex; flex-wrap: wrap; gap: 8px; }
  .chunk-btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink); font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; }
  .chunk-btn.placed { background: rgba(0, 229, 255, 0.12); border-color: var(--cyan); color: var(--cyan); }
  .chunk-btn.used { opacity: .25; cursor: not-allowed; }
  .susun-result { width: 100%; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 17px; padding: 8px 4px; }
  .susun-result.correct { color: var(--mint); }
  .susun-result.wrong { color: var(--red); }

  /* ============================================================
     DOKKAI (bacaan) — panel bacaan + progress + penjelasan
     ============================================================ */
  .dokkai-passage {
    background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 14px; position: relative;
  }
  .dokkai-passage::before {
    content: "📖"; position: absolute; top: -12px; left: 14px; font-size: 18px;
    background: var(--bg); padding: 0 6px;
  }
  .dokkai-title { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 13px;
    color: var(--gold); letter-spacing: 0.5px; margin-bottom: 8px; }
  .dokkai-text { font-family: "Noto Sans JP", sans-serif; font-size: 15.5px; line-height: 1.9;
    color: #fff; white-space: pre-line; }
  .dokkai-text mark { background: rgba(255, 215, 0, 0.35); color: #fff; border-radius: 3px;
    padding: 0 2px; box-shadow: 0 0 0 1px rgba(255,215,0,0.4) inset; }
  .dokkai-progress { font-size: 11px; color: var(--cyan); font-weight: 700; font-family: monospace;
    letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .dokkai-progress .dots { display: flex; gap: 4px; }
  .dokkai-progress .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); }
  .dokkai-progress .dot.done { background: var(--mint); }
  .dokkai-progress .dot.now { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  .dokkai-explain {
    margin-top: 14px; padding: 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.6;
    background: rgba(0,229,255,0.08); border: 1px solid var(--line); animation: fadeIn 0.3s ease;
  }
  .dokkai-explain.wrong { background: rgba(255,51,102,0.08); border-color: rgba(255,51,102,0.4); }
  .dokkai-explain .tag { font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px; color: var(--mint); }
  .dokkai-explain.wrong .tag { color: var(--red); }
  .dokkai-explain .body { color: var(--ink); }
  .continue-btn { width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--cyan), #0099FF); color: #000; font-weight: 900; font-size: 14px;
    text-transform: uppercase; letter-spacing: 1px; min-height: 48px; }

  /* RESULT */
  .result { text-align: center; padding: 4px; }
  .grade-badge { display: inline-block; width: 85px; height: 85px; border-radius: 50%; line-height: 81px; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 36px; margin-bottom: 14px; }
  .result .id-line { color: var(--sub); font-size: 12px; margin-bottom: 10px; font-family: monospace; word-break: break-all; }
  .result .big-score { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 46px; background: linear-gradient(135deg, var(--cyan), var(--mint)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 2px; }
  .result .sub { color: var(--sub); margin-bottom: 20px; font-size: 13px; }
  
  .export-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
  .export-row button { flex: 1; min-width: calc(50% - 4px); padding: 12px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: var(--cyan); font-weight: 600; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  
  .miss-list, .history-list { text-align: left; max-height: 220px; overflow-y: auto; margin: 0 0 20px; padding-right: 4px; }
  .miss-item, .history-item { background: rgba(0,0,0,.2); border-left: 3px solid var(--sakura); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .history-item { border-left-color: var(--cyan); }
  .hi-row { display: flex; align-items: center; gap: 10px; }
  .hi-main { flex: 1; min-width: 0; }
  .hi-download-btn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0,229,255,0.1); color: var(--cyan); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .hi-download-btn:active { background: rgba(0,229,255,0.25); }
  .miss-item .mi-pattern, .history-item .hi-title { font-family: "Noto Sans JP", sans-serif; font-weight: 700; color: #fff; font-size: 14px; }
  .miss-item .mi-meaning, .history-item .hi-sub { color: var(--sub); font-size: 12px; margin-top: 2px; }

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ6D2YcJWDNvrfKZzgvAjazDYNJh5kJNdEL12rXHec8h6k_gGDlMvTsrQ-Sbesho56sQ/exec";

/* Kirim rekap riwayat ke Google Apps Script (Google Sheet) secara asinkron,
   tepat saat kuis selesai. Sengaja TIDAK mengirim skor/nilai angka — sesuai
   permintaan, kolom itu diganti field 'komentar' berupa kalimat tetap.
   mode:"no-cors" dipakai supaya request tidak diblokir CORS oleh browser
   (Apps Script web app tidak selalu mengirim header CORS yang lengkap);
   konsekuensinya kita tidak bisa membaca isi respons, tapi datanya tetap
   terkirim dan tersimpan di sisi Google Sheet. */
function sendToGoogleSheet(materi, dateStr){
  if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "https://script.google.com/macros/s/AKfycbyQ6D2YcJWDNvrfKZzgvAjazDYNJh5kJNdEL12rXHec8h6k_gGDlMvTsrQ-Sbesho56sQ/exec") return;
  const payload = {
    nama: student.nama,
    nis: student.nis,
    kelas: student.kelas || "-",
    materi: materi,
    tanggal: dateStr,
    komentar: "sikap saat belajar pada awalnya kurang baik, namun sekarang sudah kaizen dan lebih baik"
  };
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(err => console.warn("Gagal mengirim riwayat ke Google Sheet:", err));
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

/* Mode Dengar & Tebak memakai Text-to-Speech BAWAAN BROWSER (Web Speech
   API) — gratis, tanpa perlu file audio apapun. PENTING: kualitas &
   kealamian suaranya BUKAN buatan kita — sepenuhnya tergantung suara
   Jepang (ja-JP) yang tersedia di browser/perangkat siswa. Chrome/Edge
   & Safari umumnya punya suara Jepang bawaan yang cukup natural; kalau
   tidak ada sama sekali, kita beri tahu jujur lewat toast (bukan diam
   saja memaksakan suara bahasa lain yang salah lafal). */
let cachedJaVoice = null;
let voicesLoaded = false;
function pickJapaneseVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  voicesLoaded = true;
  // prioritaskan suara "ja-JP" persis, lalu fallback ke apa saja berawalan "ja"
  return voices.find(v => v.lang === 'ja-JP') || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja')) || null;
}
// daftar suara kadang baru siap async setelah event 'voiceschanged' (terutama Chrome)
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => { cachedJaVoice = pickJapaneseVoice(); };
  cachedJaVoice = pickJapaneseVoice();
}
/* Kecepatan bicara disesuaikan level — makin dasar levelnya, makin
   pelan diucapkan (biar pemula jelas dengarnya), makin tinggi level
   makin mendekati kecepatan bicara natural orang Jepang. */
function speedForLevel(level){
  switch(level){
    case "N5": return 0.62;
    case "N4": return 0.7;
    case "N3": return 0.78;
    case "N2": return 0.85;
    default:   return 0.7;
  }
}

/* Untuk KANJI SATU HURUF, membaca on'yomi sendirian (tanpa kata lain
   di sekitarnya) itu tidak natural & sulit ditebak — on'yomi biasanya
   cuma "kedengaran benar" kalau muncul dalam kata majemuk (jukugo).
   Kun'yomi jauh lebih gampang dikenali sebagai kata berdiri sendiri,
   jadi kita utamakan kun'yomi utk kasus ini; kalau kanjinya memang
   tidak punya kun'yomi (cuma ada di kata majemuk), baru pakai on'yomi.
   Kotoba/kata majemuk (2+ huruf) tidak terpengaruh, tetap dibaca apa
   adanya karena bacaan gabungannya memang sudah natural. */
function preferredReadingFor(item){
  if(item && item.type === 'kanji' && item.jp && item.jp.length === 1){
    if(item.kunyomi && item.kunyomi !== '-'){
      return item.kunyomi.split('・')[0].replace(/\./g, ''); // ambil bacaan pertama, buang titik pemisah okurigana
    }
    if(item.onyomi && item.onyomi !== '-'){
      return item.onyomi.split('・')[0];
    }
  }
  return item ? item.jp : '';
}

function speakJapanese(text, level){
  if(!('speechSynthesis' in window)){
    showGameToast("🔇 Browser ini tidak mendukung suara sama sekali");
    return;
  }
  if(!cachedJaVoice) cachedJaVoice = pickJapaneseVoice();
  window.speechSynthesis.cancel(); // hentikan ucapan sebelumnya kalau masih jalan
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = speedForLevel(level);
  // Kalau siswa sudah memilih suara sendiri (lewat "🔊 Pilih Suara"), pakai
  // itu dulu; kalau belum pernah pilih, jatuh ke suara Jepang otomatis.
  const chosenVoice = getChosenVoice();
  if(chosenVoice){
    utter.voice = chosenVoice;
  } else if(cachedJaVoice){
    utter.voice = cachedJaVoice;
  } else if(voicesLoaded){
    // daftar suara sudah termuat tapi memang tidak ada satupun yg Jepang
    showGameToast("⚠️ Perangkat ini belum punya suara Jepang, coba pakai Chrome");
  }
  window.speechSynthesis.speak(utter);
}

/* ============================================================
   PEMILIH SUARA JEPANG — siswa bisa lihat & COBA semua suara yang
   tersedia di perangkatnya sendiri, lalu pilih mana yang paling
   natural kedengarannya. Preferensi disimpan per siswa (NIS).
   ============================================================ */
function getChosenVoice(){
  if(!('speechSynthesis' in window)) return null;
  const profile = getPlayerProfile();
  if(!profile.voiceURI) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.voiceURI === profile.voiceURI) || null;
}
function getJapaneseVoiceList(){
  if(!('speechSynthesis' in window)) return [];
  const voices = window.speechSynthesis.getVoices();
  return voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
}
function openVoicePicker(){
  const jaVoices = getJapaneseVoiceList();
  const allVoices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
  const profile = getPlayerProfile();
  const el = document.createElement("div");
  el.className = "shop-overlay";
  const listVoices = jaVoices.length ? jaVoices : allVoices;
  const bodyHtml = listVoices.length ? listVoices.map(v => {
    const selected = profile.voiceURI === v.voiceURI;
    return `<div class="voice-item ${selected?'selected':''}" data-uri="${v.voiceURI}">
      <button class="vi-test-btn" data-test="${v.voiceURI}">🔊</button>
      <div class="vi-mid"><div class="vi-name">${v.name}</div><div class="vi-lang">${v.lang}</div></div>
      <button class="vi-use-btn ${selected?'is-selected':''}" data-use="${v.voiceURI}">${selected ? '✓ Dipakai' : 'Pakai'}</button>
    </div>`;
  }).join("") : `<div class="voice-empty-note">😔 Perangkat ini belum punya suara Jepang sama sekali.<br>Coba buka di Google Chrome, atau gunakan HP/laptop lain untuk hasil terbaik.</div>`;
  el.innerHTML = `
    <div class="shop-card">
      <h3>🔊 Pilih Suara Jepang</h3>
      <div style="font-size:11px;color:var(--sub);margin-bottom:12px;">
        ${jaVoices.length ? `Ditemukan ${jaVoices.length} suara Jepang di perangkatmu. Coba tiap suara, lalu pilih yang paling natural!` : (allVoices.length ? 'Tidak ada suara Jepang khusus, tapi ini semua suara yang tersedia (mungkin kurang natural):' : 'Memuat daftar suara...')}
      </div>
      ${bodyHtml}
      <button class="shop-close" id="voicePickerCloseBtn">Tutup</button>
    </div>
  `;
  document.body.appendChild(el);
  el.querySelectorAll("[data-test]").forEach(btn=>{
    btn.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      const v = listVoices.find(x=>x.voiceURI===btn.dataset.test);
      if(v && 'speechSynthesis' in window){
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance("こんにちは、元気ですか？");
        u.voice = v; u.lang = v.lang || 'ja-JP'; u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    });
  });
  el.querySelectorAll("[data-use]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = getPlayerProfile();
      p.voiceURI = btn.dataset.use;
      savePlayerProfile(p);
      el.remove();
      showGameToast("🔊 Suara pilihanmu disimpan!");
      openVoicePicker(); // buka ulang biar tanda "✓ Dipakai" ter-refresh
    });
  });
  el.querySelector("#voicePickerCloseBtn").addEventListener("click", ()=> el.remove());
}

function playSFX(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'click') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
    osc.start(); osc.stop(audioCtx.currentTime + 0.09);
  } else if (type === 'start') {
    // "power up" jingle singkat buat tombol Mulai — kesan mesin arcade nyala
    osc.type = 'square';
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      osc.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.07);
    });
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.32);
    osc.start(); osc.stop(audioCtx.currentTime + 0.32);
  }
}

/* ============================================================
   MUSIK LATAR (BGM) — pakai file audio asli (gyutto.mp3), bukan
   lagi sintesis Web Audio. SATU lagu yang sama diputar di semua
   layar & mode permainan, KECUALI Mode Dengar & Tebak yang sengaja
   TANPA musik sama sekali (biar tidak mengganggu konsentrasi
   mendengar soal TTS).
   ============================================================ */
function bgmEl(){ return document.getElementById('bgmAudio'); }
let bgmPlaying = false;

/* Mode permainan mana dapat musik, mana yang tidak — hanya Dengar &
   Tebak yang dikecualikan (return null = tanpa musik). Selain itu
   semua pakai lagu yang sama, jadi nilai kembaliannya sekadar
   penanda "ada musik" (truthy), bukan nama tema lagi. */
function gameModeBgmTheme(mode, type){
  if(type === 'listening') return null; // tanpa musik, biar tidak ganggu dengar
  return 'gyutto';
}
function setBgmTheme(themeId){
  if(!themeId){ stopBGM(); return; } // listening -> matikan total
  // Hanya ada 1 lagu, jadi tidak perlu ganti track apa pun di sini;
  // startBGM() di bawah ini yang akan memastikan lagu diputar/dilanjut.
}

function startBGM(){
  const audio = bgmEl();
  if(!audio) return;
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if(bgmPlaying && !audio.paused) return; // idempotent, tidak dobel kalau sudah main
  audio.volume = 1;
  const p = audio.play();
  if(p && typeof p.catch === 'function') p.catch(()=>{ /* diabaikan: browser blokir autoplay sblm ada interaksi user */ });
  bgmPlaying = true;
}

function stopBGM(){
  const audio = bgmEl();
  bgmPlaying = false;
  if(!audio || audio.paused) return;
  // fade out halus biar tidak putus mendadak
  const startVol = audio.volume;
  let step = 0;
  const steps = 8;
  const fadeTimer = setInterval(()=>{
    step++;
    audio.volume = Math.max(0, startVol * (1 - step/steps));
    if(step >= steps){
      clearInterval(fadeTimer);
      audio.pause();
      audio.volume = 1; // pulihkan volume penuh, siap dipakai lagi nanti
    }
  }, 40);
}

/* "Duck" = redam volume musik (bukan matikan total) — dipakai saat
   sedang main (kuis/mini-game) supaya tetap ada nuansa suara tanpa
   mengganggu konsentrasi menjawab. */
function duckBGM(volume){
  const audio = bgmEl();
  if(!audio) return;
  audio.volume = volume;
}
function restoreBGMVolume(){ duckBGM(1); }

/* ============================================================
   GAME JUICE — efek visual (confetti, shake, popup skor/combo,
   toast) supaya kuis terasa seperti game sungguhan, bukan cuma
   soal-jawab polos.
   ============================================================ */
const CONFETTI_COLORS = ["#00E5FF","#FF2A7A","#9D00FF","#FFC107","#00F0B5"];

function spawnConfetti(cx, cy, count){
  count = count || 22;
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const angle = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*90;
    const tx1 = Math.cos(angle)*dist, ty1 = Math.sin(angle)*dist - 20;
    el.style.left = cx+"px"; el.style.top = cy+"px";
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.setProperty("--tx0","0px"); el.style.setProperty("--ty0","0px");
    el.style.setProperty("--tx1", tx1+"px"); el.style.setProperty("--ty1", ty1+"px");
    el.style.setProperty("--rot", (Math.random()*540-270)+"deg");
    el.style.animation = "confettiFall " + (0.7+Math.random()*0.5) + "s ease-out forwards";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1300);
  }
}

function shakeScreen(){
  const area = $("gameArea");
  if(!area) return;
  area.classList.remove("shake-active");
  void area.offsetWidth; // restart animasi
  area.classList.add("shake-active");
  setTimeout(()=> area.classList.remove("shake-active"), 420);
}

function showScorePopup(points, anchorEl){
  if(!anchorEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "score-popup";
  el.textContent = (points>0?"+":"") + points;
  el.style.left = (rect.left + rect.width/2 - 16) + "px";
  el.style.top = (rect.top - 6) + "px";
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 950);
}

function showComboPopup(streak){

  el.innerHTML = `<div class="big">🔥 x${streak}</div><div class="small">${label}</div>`;
  document.body.appendChild(el);

function showGameToast(text){

/* ============================================================

   pemain layaknya RPG, biar makin sering main makin naik level,

   ============================================================ */
function playerProfileKey(){ return `nafis_player_${(student && student.nis) || "guest"}`; }
function getPlayerProfile(){
  try{
    const p = JSON.parse(localStorage.getItem(playerProfileKey()));
    if(p){
      // migrasi data lama yang belum punya field avatar
      if(!p.avatar) p.avatar = "pelajar";
      if(!p.ownedAvatars) p.ownedAvatars = ["pelajar"];
      return p;
    }
  }catch(e){}
  return { xp: 0, coins: 0, theme: "default", ownedThemes: ["default"], avatar: "pelajar", ownedAvatars: ["pelajar"], lastPlayDate: null, streakDays: 0 };
}
function savePlayerProfile(p){ localStorage.setItem(playerProfileKey(), JSON.stringify(p)); }

/* Kurva XP ala RPG: level 1 butuh 100xp, tiap level berikutnya naik 25% */
function levelInfoFromXP(xp){
  let lvl = 1, need = 100, total = 0;
  while(xp >= total + need){ total += need; lvl++; need = Math.round(need * 1.25); }
  return { level: lvl, xpIntoLevel: xp - total, xpNeeded: need };
}
function playerTitle(level){
  if(level >= 20) return "Legenda 語彙";
  if(level >= 15) return "Master Sensei";
  if(level >= 10) return "Ahli Bahasa";
  if(level >= 5) return "Petualang";
  return "Pemula";
}

  { id: "sunset",  name: "Sunset Blaze", price: 800, colors: { cyan: "#FF9F5B", sakura: "#FF2A7A" } }

function applyTheme(themeId){

  document.documentElement.style.setProperty("--cyan", t.colors.cyan);
