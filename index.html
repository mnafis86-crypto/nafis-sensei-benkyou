<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nafis Sensei ゲームコーナー — Penilaian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
   :root {
    --bg: #0A0A14; 
    --panel: rgba(22, 22, 34, 0.75); 
    --panel2: rgba(32, 32, 54, 0.9);
    --ink: #E2E8F0; 
    --sub: #94A3B8; 
    --line: rgba(0, 229, 255, 0.25);
    --sakura: #FF2A7A;
    --sakura-dk: #D9005A;
    --cyan: #00E5FF;
    --mint: #00F0B5; 
    --gold: #FFD700; 
    --red: #FF3366;
    --n5: #00E5FF; 
    --n4: #FFD700;
    --n3: #FF9F5B;
    --n2: #FF2A7A;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; min-height: 100vh; 
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 42, 122, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0, 229, 255, 0.15) 0%, transparent 45%),
      var(--bg);
    background-image: url('data:image/svg+xml;utf8,<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><text x="15" y="45" font-size="20" fill="rgba(255,255,255,0.015)" font-family="sans-serif">語彙</text></svg>'),
                      radial-gradient(circle at 15% 10%, rgba(255, 42, 122, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(0, 229, 255, 0.15) 0%, transparent 45%), var(--bg);
    color: var(--ink); 
    font-family: "Inter", "Noto Sans JP", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .wrap { 
    width: 100%; 
    max-width: 520px; 
    margin: 0 auto; 
    padding: 16px 14px 50px; 
  }
  
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .brand { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: center; background: var(--panel); padding: 14px; border-radius: 16px; border: 1px solid var(--line); backdrop-filter: blur(10px); }
  .brand h1 { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 20px; margin: 0; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); color: var(--cyan); }
  .brand span { color: var(--sub); font-size: 11.5px; letter-spacing: 0.3px; }
  
  .whoami { font-size: 12px; color: var(--sub); background: var(--panel2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; display: none; width: 100%; text-align: center; margin-bottom: 12px; backdrop-filter: blur(10px); }
  .whoami b { color: var(--cyan); }

  .nav-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; text-align: center; }
  .tab-btn.active { background: rgba(0, 229, 255, 0.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2) inset; }

  .panel { display: none; animation: fadeIn 0.3s ease; } 
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .card { 
    background: var(--panel); 
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08); 
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; 
    padding: 20px 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  ruby { ruby-position: over; }
  rt { font-size: 0.55em; color: var(--cyan); font-weight: normal; }

  /* LOGIN */
  .login-wrap { max-width: 100%; margin: 10px auto; text-align: center; }
  .login-wrap h2 { font-family: "Noto Sans JP", sans-serif; font-size: 22px; margin: 0 0 6px; color: var(--ink); }
  .login-wrap p { color: var(--sub); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--cyan); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .field input, .field select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,0.4); color: var(--ink); font-family: inherit; font-size: 14px; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--sakura); box-shadow: 0 0 10px rgba(255, 42, 122, 0.3); }
  
  .login-btn { width: 100%; margin-top: 6px; padding: 15px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--sakura), var(--sakura-dk)); color: #fff; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 42, 122, 0.4); min-height: 50px; }

  /* STUDY & FLASHCARD */
  .flash { border-radius: 16px; padding: 30px 18px; text-align: center; position: relative; background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.1), transparent), rgba(0,0,0,0.3); border: 1px solid var(--line); min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .flash .lvl { position: absolute; top: 12px; left: 14px; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; border: 1px solid; }
  .flash .lvl.n5 { background: rgba(0, 229, 255, 0.1); color: var(--n5); border-color: var(--n5); }
  .flash .lvl.n4 { background: rgba(255, 215, 0, 0.1); color: var(--n4); border-color: var(--n4); }
  .flash .lvl.n3 { background: rgba(255, 159, 91, 0.1); color: var(--n3); border-color: var(--n3); }
  .flash .lvl.n2 { background: rgba(255, 42, 122, 0.1); color: var(--n2); border-color: var(--n2); }
  .flash .src { position: absolute; top: 12px; right: 14px; font-size: 10.5px; color: var(--sub); background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 6px; }
  
  .flash .pattern { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 24px; line-height: 1.4; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.3); }
  .flash .meaning { color: var(--cyan); font-size: 14px; font-weight: 600; }
  .flash .detail-box { color: var(--ink); font-size: 12.5px; line-height: 1.6; text-align: left; background: rgba(0, 229, 255, 0.05); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 4px; }
  .flash .example-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--sakura); border-radius: 8px; padding: 12px 14px; text-align: left; margin-top: 8px; }
  .flash .example-jp { font-family: "Noto Sans JP", sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fff; line-height: 1.5; }
  .flash .example-id { color: var(--sub); font-size: 13px; font-style: italic; }
  
  .flash.kotoba-mode .pattern { font-size: 32px; color: var(--mint); letter-spacing: 1px; }
  
  .study-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; }
  .navbtn { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--ink); font-weight: 600; font-size: 12.5px; cursor: pointer; min-height: 42px; }
  .navbtn:disabled { opacity: .3; cursor: not-allowed; }
  .progress-text { color: var(--cyan); font-size: 11.5px; font-family: monospace; white-space: nowrap; }

  /* GAME SETUP / PLAY */
  .start-screen { text-align: center; padding: 4px; }
  .start-screen h2 { font-family: "Noto Sans JP", sans-serif; font-size: 22px; margin: 0 0 8px; color: #fff; }
  .start-screen p { color: var(--sub); font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
  
  .setup-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 22px; }
  .setup-box { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; text-align: left; }
  .setup-box .lbl { font-size: 11px; color: var(--cyan); font-weight: 700; margin-bottom: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
  .opt-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt-row button { flex: 1; min-width: calc(20% - 6px); padding: 9px 4px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--sub); font-size: 12px; font-weight: 600; cursor: pointer; min-height: 38px; }
  .opt-row button.active { background: var(--sakura); border-color: var(--sakura); color: #fff; box-shadow: 0 0 8px rgba(255, 42, 122, 0.4); }
  
  .play-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--cyan), #0099FF); color: #000; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 1.2px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); min-height: 52px; }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; font-family: monospace; }
  .hud .score { font-weight: 700; color: var(--cyan); font-size: 15px; }
  .hud .streak { color: var(--sakura); font-weight: 700; font-size: 13px; text-shadow: 0 0 6px rgba(255, 42, 122, 0.5); }
  
  .timerbar-track { height: 5px; border-radius: 5px; background: rgba(0,0,0,0.5); overflow: hidden; margin-bottom: 18px; }
  .timerbar-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--mint)); width: 100%; transition: width .2s linear; }
  .timerbar-fill.danger { background: linear-gradient(90deg, var(--red), var(--sakura)); }

  .qcard { background: rgba(0,0,0,0.25); border-left: 3px solid var(--cyan); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .qcard .qtype { font-size: 11px; color: var(--gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .qcard .qnum { font-size: 11px; color: var(--sub); margin-bottom: 8px; font-family: monospace; letter-spacing: 0.5px; }
  .qcard .qtext { font-size: 16px; line-height: 1.5; color: #fff; }
  .qcard .qtext b { color: var(--cyan); }

  .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .opt { text-align: left; padding: 15px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--ink); cursor: pointer; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 15px; min-height: 54px; display: flex; align-items: center; }
  .opt.correct { background: rgba(0, 240, 181, 0.15); border-color: var(--mint); color: var(--mint); }
  .opt.wrong { background: rgba(255, 51, 102, 0.15); border-color: var(--red); color: var(--red); }

  /* RESULT */
  .result { text-align: center; padding: 4px; }
  .grade-badge { display: inline-block; width: 85px; height: 85px; border-radius: 50%; line-height: 81px; font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 36px; margin-bottom: 14px; }
  .result .id-line { color: var(--sub); font-size: 12px; margin-bottom: 10px; font-family: monospace; word-break: break-all; }
  .result .big-score { font-family: "Noto Sans JP", sans-serif; font-weight: 900; font-size: 46px; background: linear-gradient(135deg, var(--cyan), var(--mint)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 2px; }
  .result .sub { color: var(--sub); margin-bottom: 20px; font-size: 13px; }
  
  .export-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
  .export-row button { flex: 1; min-width: calc(50% - 4px); padding: 12px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: var(--cyan); font-weight: 600; font-size: 12.5px; cursor: pointer; min-height: 44px; }
  
  .miss-list, .history-list { text-align: left; max-height: 220px; overflow-y: auto; margin: 0 0 20px; padding-right: 4px; }
  .miss-item, .history-item { background: rgba(0,0,0,.2); border-left: 3px solid var(--sakura); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .history-item { border-left-color: var(--cyan); }
  .miss-item .mi-pattern, .history-item .hi-title { font-family: "Noto Sans JP", sans-serif; font-weight: 700; color: #fff; font-size: 14px; }
  .miss-item .mi-meaning, .history-item .hi-sub { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .no-miss { color: var(--mint); font-weight: 600; padding: 14px; background: rgba(0, 240, 181, 0.1); border-radius: 10px; border: 1px solid rgba(0, 240, 181, 0.3); font-size: 13.5px; }
  
  .dashboard-layout { display: flex; flex-direction: column; gap: 16px; }
  .col-title { font-family: "Noto Sans JP", sans-serif; font-size: 16px; color: var(--cyan); margin-top: 0; margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  
  .modern-select-wrap { margin-bottom: 14px; }
  .modern-select-wrap label { display: block; font-size: 11.5px; color: var(--sub); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .modern-select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,0.5); color: var(--cyan); font-family: "Noto Sans JP", sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .modern-select option { background: var(--bg); color: var(--ink); }
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">

      <div class="tab-btn" id="tabStudyBtn">📖 Pelajari Materi</div>
      <div class="tab-btn" id="tabHistoryBtn">📜 Riwayat Saya</div>
    </div>

    <!-- TAB 1: KUIS / GAME PENILAIAN -->
    <div class="panel active" id="panel-game">

  </div>
</div>

<script>
const GOOGLE_SCRIPT_URL = ""; 

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSFX(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

const $ = id => document.getElementById(id);
let student = null;

$("tabGameBtn").addEventListener("click", () => switchTab('game'));
$("tabStudyBtn").addEventListener("click", () => switchTab('study'));
$("tabHistoryBtn").addEventListener("click", () => switchTab('history'));

function switchTab(tab) {
  document.querySelectorAll(".nav-tabs .tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".dashboard-layout > .panel").forEach(p => p.classList.remove("active"));
  
  if (tab === 'game') {
    $("tabGameBtn").classList.add("active");
    $("panel-game").classList.add("active");
    renderStart();
  } else if (tab === 'study') {
    $("tabStudyBtn").classList.add("active");
    $("panel-study").classList.add("active");
    applyStudyFilter();
  } else if (tab === 'history') {
    $("tabHistoryBtn").classList.add("active");
    $("panel-history").classList.add("active");
    renderHistory();
  }
}

$("loginBtn").addEventListener("click", ()=>{
  const nama = $("loginNama").value.trim();

  const kelas = $("loginKelas").value.trim();
  if(!nama || !nis){ alert("Nama dan NIS wajib diisi ya."); return; }
  student = { nama, nis, kelas };

});

window.addEventListener("load", ()=>{
  const saved = localStorage.getItem("nafis_student");
  if(saved){
    student = JSON.parse(saved);
    initApp();

});

function initApp(){
  $("panel-login").classList.remove("active");
  $("mainApp").style.display = "flex";
  const w = $("whoami");
  w.style.display = "block";
  w.innerHTML = `👤 <b>${student.nama}</b> &middot; NIS ${student.nis}${student.kelas ? " &middot; "+student.kelas : ""}`;

let studyMode = "bunpo";
let studyBookFilter = "n2";
let studyList = [];
let studyIdx = 0;

$("typeSelect").addEventListener("change", (e)=>{
  studyMode = e.target.value;
  applyStudyFilter();
});
$("bookSelect").addEventListener("change", (e)=>{
  studyBookFilter = e.target.value;
  applyStudyFilter();
});

function matchesBook(p, filterVal){
  switch(filterVal){
    case "all": return true;
    case "n5": return p.level==="N5";
    case "n4": return p.level==="N4";
    case "n3": return p.level==="N3";
    case "n2": return p.level==="N2";
    default: return true;
  }
}

function applyStudyFilter(){
  let dataSource = studyMode === "bunpo" ? PATTERNS : KOTOBA;
  studyList = dataSource.filter(p=>matchesBook(p, studyBookFilter));
  studyIdx = 0;
  renderFlash();
}

function renderFlash(){
  if(!studyList.length){
    $("flashCard").innerHTML = `<div class="meaning">Tidak ada materi untuk filter ini.</div>`;
    $("flashCard").classList.remove("kotoba-mode");
    $("studyProgress").textContent = `0/0`;
    $("prevBtn").disabled = true; $("nextBtn").disabled = true;
    return;
  }
  
  const p = studyList[studyIdx];
  const srcLabel = p.level;
  
  if (studyMode === "bunpo") {
    $("flashCard").classList.remove("kotoba-mode");
    $("flashCard").innerHTML = `
      <div class="lvl ${p.level.toLowerCase()}">${p.level}</div>
      <div class="src">${srcLabel}</div>
      <div class="pattern">${p.pattern}</div>
      <div class="meaning">${p.meaning}</div>
      ${p.detail ? `<div class="detail-box">${p.detail}</div>` : ""}
      <div class="example-box">
        <div class="example-jp">${p.example}</div>
        <div class="example-id">${p.tr}</div>
      </div>
    `;
  } else {
    $("flashCard").classList.add("kotoba-mode");
    $("flashCard").innerHTML = `
      <div class="lvl ${p.level.toLowerCase()}">${p.level}</div>
      <div class="src">${srcLabel}</div>
      <div class="pattern">${p.jp}</div>
      <div class="meaning" style="margin-top:15px;font-size:18px;">${p.meaning}</div>
    `;
  }
  
  $("studyProgress").textContent = `${studyIdx+1}/${studyList.length}`;
  $("prevBtn").disabled = studyIdx===0;
  $("nextBtn").disabled = studyIdx===studyList.length-1;
}
$("prevBtn").addEventListener("click", ()=>{ if(studyIdx>0){studyIdx--; renderFlash();} });
$("nextBtn").addEventListener("click", ()=>{ if(studyIdx<studyList.length-1){studyIdx++; renderFlash();} });

let setupScope = "n2";
let setupCount = 20;
let setupType = "kotoba";

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildQuestions(scope, count, typeMode){
  if (typeMode === "bunpo") {
    const pool = PATTERNS.filter(p=>matchesBook(p, scope));
    if(!pool.length) return [];
    const n = count==="semua" ? pool.length : Math.min(parseInt(count), pool.length);
    const chosen = shuffle(pool).slice(0, n);
    
    return chosen.map(correct => {
      const distractorsPool = PATTERNS.filter(p=>p.pattern!==correct.pattern);
      const distractors = shuffle(distractorsPool).slice(0,3);
      const options = shuffle([correct, ...distractors]);
      return {
        type: 'mc_pattern', correct,
        qText: `Pola kalimat untuk: <b>${correct.meaning}</b>?`,
        correctAns: correct.pattern, options: options.map(o => o.pattern)
      };
    });
  } 
  else if (typeMode === "kotoba") {
    const pool = KOTOBA.filter(p=>matchesBook(p, scope));
    if(!pool.length) return [];
    const n = count==="semua" ? pool.length : Math.min(parseInt(count), pool.length);
    const chosen = shuffle(pool).slice(0, n);
    
    return chosen.map(correct => {
      const rand = Math.random();
      if (rand < 0.5) {
        const distractors = shuffle(KOTOBA.filter(p=>p.jp!==correct.jp)).slice(0,3);
        const options = shuffle([correct, ...distractors]);
        return {
          type: 'mc_kotoba_jp', correct,
          qText: `Apa bahasa Jepangnya <b>"${correct.meaning}"</b>?`,
          correctAns: correct.jp, options: options.map(o => o.jp)
        };
      } else {
        const distractors = shuffle(KOTOBA.filter(p=>p.meaning!==correct.meaning)).slice(0,3);
        const options = shuffle([correct, ...distractors]);
        return {
          type: 'mc_kotoba_id', correct,
          qText: `Apa arti dari kanji/kosakata <b>${correct.jp}</b>?`,
          correctAns: correct.meaning, options: options.map(o => o.meaning)
        };
      }
    });
  }
}

  $("gameArea").innerHTML = `
    <div class="start-screen">
      <h2>Siap uji ingatanmu?</h2>
      <p>Pilih jenis dan cakupan kuis, lalu jawab sebelum waktu habis!</p>

  document.querySelectorAll("#typeRow button").forEach(b=>{

      document.querySelectorAll("#typeRow button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); setupType = b.dataset.v;
    });
  });
  document.querySelectorAll("#scopeRow button").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll("#scopeRow button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); setupScope = b.dataset.v;
    });
  });
  document.querySelectorAll("#countRow button").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll("#countRow button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); setupCount = b.dataset.v;
    });
  });
  
  $("startBtn").addEventListener("click", startGame);
}

let gState = null;
function startGame(){
  const qs = buildQuestions(setupScope, setupCount, setupType);
  if(qs.length === 0) {
    alert("Maaf, belum ada soal untuk filter tersebut."); return;
  }
  
  gState = {
    questions: qs,
    qi: 0, score: 0, streak: 0, correctCount: 0, misses: [],
    timer: null, timeLeft: 20, timeTotal: 20, locked: false,
    startedAt: new Date(), userJumble: []
  };
  renderQuestion();
}

function renderQuestion(){
  clearInterval(gState.timer);
  const q = gState.questions[gState.qi];
  const qTime = 20;
  gState.timeLeft = qTime; gState.timeTotal = qTime;
  gState.locked = false;

  let typeLabel = setupType === "bunpo" ? "Pola Kalimat" : "Kosakata & Kanji";

  $("gameArea").innerHTML = `
    <div class="hud">
      <span class="streak">${gState.streak>1 ? "🔥 Streak x"+gState.streak : ""}</span>
      <span class="score">⭐ ${gState.score}</span>
    </div>
    <div class="timerbar-track"><div class="timerbar-fill" id="timerFill"></div></div>
    <div class="qcard">
      <div class="qtype">[ ${typeLabel} ]</div>
      <div class="qnum">Soal ${gState.qi+1}/${gState.questions.length} &middot; <span style="color:${q.correct.level==='N2'?'var(--n2)':(q.correct.level==='N3'?'var(--n3)':'var(--n5)')}">${q.correct.level}</span></div>
      <div class="qtext">${q.qText}</div>
    </div>
    
    <div class="options" id="optionsWrap">
      ${q.options.map((o,i)=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}
    </div>
  `;

  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=> selectAnswer(btn.dataset.v === q.correctAns));
  });

  const fill = $("timerFill");
  gState.timer = setInterval(()=>{
    gState.timeLeft -= 0.1;
    const pct = Math.max(0, (gState.timeLeft/gState.timeTotal)*100);
    fill.style.width = pct+"%";
    if(pct < 30) fill.classList.add("danger"); else fill.classList.remove("danger");
    if(gState.timeLeft <= 0){ clearInterval(gState.timer); selectAnswer(false); }
  }, 100);
}

function selectAnswer(isCorrect){
  if(gState.locked) return;
  gState.locked = true;
  clearInterval(gState.timer);

  const q = gState.questions[gState.qi];

  if(isCorrect){
    playSFX('correct');
    gState.streak++;
    gState.correctCount++;
    gState.score += (10 + Math.min(gState.streak-1,5)*2);
  } else {
    playSFX('wrong');
    gState.streak = 0;
    gState.misses.push(q.correct);
  }

  setTimeout(()=>{
    if(gState.qi < gState.questions.length-1){
      gState.qi++;
      renderQuestion();
    } else {
      renderResult();
    }
  }, 500);
}

function gradeFor(pct){
  if(pct>=90) return {letter:"A", color:"var(--mint)"};
  if(pct>=75) return {letter:"B", color:"var(--n5)"};
  if(pct>=60) return {letter:"C", color:"var(--gold)"};
  if(pct>=40) return {letter:"D", color:"var(--n4)"};
  return {letter:"E", color:"var(--red)"};
}

function renderResult(){
  const total = gState.questions.length;
  const acc = Math.round((gState.correctCount/total)*100);
  const grade = gradeFor(acc);
  const dateStr = gState.startedAt.toLocaleString("id-ID");

  saveHistoryToLocal({
    tanggal: dateStr,
    jenis: setupType === 'bunpo' ? 'Pola Kalimat' : 'Kosakata & Kanji',
    skor: gState.score,
    benar: gState.correctCount,
    total: total,
    akurasi: acc,
    nilai: grade.letter
  });

  $("gameArea").innerHTML = `
    <div class="result">
      <div class="grade-badge" style="background:${grade.color}22;color:${grade.color};border:2px solid ${grade.color};">${grade.letter}</div>
      <div class="id-line">${student.nama} &middot; NIS ${student.nis}${student.kelas ? " &middot; "+student.kelas : ""}</div>
      <div class="big-score">${gState.score}</div>
      <div class="sub">poin &middot; ${gState.correctCount}/${total} benar (${acc}%)</div>
      <div class="export-row">
        <button id="copyBtn">📋 Salin Hasil</button>
      </div>
      ${gState.misses.length ? `
        <div style="text-align:left;font-weight:700;font-size:13px;margin-bottom:8px;">Perlu diulang:</div>
        <div class="miss-list">
          ${gState.misses.map(m=>`<div class="miss-item"><div class="mi-pattern">${setupType === 'bunpo' ? m.pattern : m.jp}</div><div class="mi-meaning">${m.meaning}</div></div>`).join("")}
        </div>
      ` : `<div class="no-miss">🏆 Sempurna! Semua benar.</div>`}
      <button class="play-btn" id="againBtn" style="margin-top:10px;">↻ Main Lagi</button>
    </div>
  `;

  $("copyBtn").addEventListener("click", ()=>{
    const text = `HASIL PENILAIAN ${setupType === 'bunpo' ? 'POLA KALIMAT' : 'KOSAKATA & KANJI'}\nNama: ${student.nama}\nNIS: ${student.nis}\nKelas: ${student.kelas||"-"}\nSkor: ${gState.score} poin\nBenar: ${gState.correctCount}/${total} (${acc}%)\nNilai: ${grade.letter}`;
    navigator.clipboard.writeText(text).then(()=>{
      $("copyBtn").textContent = "✓ Tersalin";
      setTimeout(()=> $("copyBtn").textContent = "📋 Salin Hasil", 1500);
    });
  });

  $("againBtn").addEventListener("click", renderStart);
}

function saveHistoryToLocal(record) {
  let list = [];
  const saved = localStorage.getItem("nafis_history");
  if(saved) list = JSON.parse(saved);
  list.unshift(record);
  if(list.length > 20) list.pop();
  localStorage.setItem("nafis_history", JSON.stringify(list));
}

function renderHistory() {
  const listEl = $("historyList");
  const saved = localStorage.getItem("nafis_history");
  if (!saved || JSON.parse(saved).length === 0) {
    listEl.innerHTML = `<div style="text-align:center;color:var(--sub);padding:20px;">Belum ada riwayat kuis yang dimainkan.</div>`;
    return;
  }
  const list = JSON.parse(saved);
  listEl.innerHTML = list.map(h => `
    <div class="history-item">
      <div class="hi-title">[${h.jenis}] ⭐ Skor: ${h.skor} (${h.benar}/${h.total} Benar - ${h.akurasi}%) - Nilai: ${h.nilai}</div>
      <div class="hi-sub">🕒 ${h.tanggal}</div>
    </div>
  `).join("");
}
